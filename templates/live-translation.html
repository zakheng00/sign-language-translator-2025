<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Translation</title>
    <style>
        video, canvas { border: 1px solid black; }
        #progress { font-size: 18px; }
    </style>
</head>
<body>
    <h1>Live Sign Language Translation</h1>
    <video id="video" width="640" height="480" autoplay muted></video>
    <canvas id="canvas" width="640" height="480" style="display:none;"></canvas>
    <div id="progress">Progress: 0%</div>
    <button id="startRecording">Start Recording</button>
    <button id="stopRecording" style="display:none;">Stop Recording</button>
    <div id="result">Result: </div>

    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>

    <script type="module">
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const progressDiv = document.getElementById('progress');
        const resultDiv = document.getElementById('result');
        const startBtn = document.getElementById('startRecording');
        const stopBtn = document.getElementById('stopRecording');

        let stream;
        let recorder;
        let frames = [];
        const NUM_FRAMES = 100; // 錄製 100 幀
        let frameCount = 0;
        let recording = false;

        // 初始化攝像頭
        navigator.mediaDevices.getUserMedia({ video: true, audio: false })
            .then(s => {
                stream = s;
                video.srcObject = stream;
            })
            .catch(err => console.error('Error accessing camera:', err));

        const holistic = new Holistic({locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`});
        holistic.setOptions({
            upperBodyOnly: false,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        holistic.onResults(onResults);

        function extractKeypoints(results) {
            const pose = results.poseLandmarks ? results.poseLandmarks.map(l => [l.x, l.y, l.z]).slice(0, 24) : Array(24).fill([0, 0, 0]);
            const leftHand = results.leftHandLandmarks ? results.leftHandLandmarks.map(l => [l.x, l.y, l.z]).slice(0, 21) : Array(21).fill([0, 0, 0]);
            const rightHand = results.rightHandLandmarks ? results.rightHandLandmarks.map(l => [l.x, l.y, l.z]).slice(0, 21) : Array(21).fill([0, 0, 0]);
            return [...pose.flat(), ...leftHand.flat(), ...rightHand.flat()];
        }

        function onResults(results) {
            if (recording && frameCount < NUM_FRAMES) {
                ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
                const imageData = ctx.getImageData(0, 0, canvas.width, canvas.height);
                frames.push(imageData.data); // 儲存圖像數據
                frameCount++;
                progressDiv.textContent = `Progress: ${(frameCount / NUM_FRAMES * 100).toFixed(0)}%`;
                if (frameCount < NUM_FRAMES) {
                    requestAnimationFrame(() => holistic.send({ image: video }));
                } else {
                    stopRecording();
                }
            }
        }

        startBtn.onclick = () => {
            recording = true;
            frameCount = 0;
            frames = [];
            startBtn.style.display = 'none';
            stopBtn.style.display = 'inline';
            holistic.send({ image: video });
        };

        stopBtn.onclick = () => {
            stopRecording();
        };

        function stopRecording() {
            recording = false;
            stopBtn.style.display = 'none';
            startBtn.style.display = 'inline';
            progressDiv.textContent = 'Progress: 0%';

            // 將 frames 轉為視頻並上傳
            const blob = new Blob(frames, { type: 'video/mp4' });
            const formData = new FormData();
            formData.append('video', blob, 'recording.mp4');

            fetch('/predict', {
                method: 'POST',
                body: formData
            })
            .then(response => response.json())
            .then(data => {
                resultDiv.textContent = `Result: ${data.gesture}`;
            })
            .catch(error => console.error('Error:', error));
        }

        // 啟動攝像頭處理
        const camera = new Camera(video, {
            onFrame: async () => {
                await holistic.send({ image: video });
            },
            width: 640,
            height: 480
        });
        camera.start();
    </script>
</body>
</html>
