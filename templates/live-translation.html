<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手语翻译系统 - Room Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">手语翻译系统 ✌️ - Room Mode</h1>
    <div class="text-center mb-4">
      <p>Click to join a room (max 2 users per room, simulated).</p>
    </div>
    <div id="roomsList" class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8"></div>
    <div id="currentRoom" class="text-center mb-4"></div>
    <div id="roomError" class="text-red-500 text-center hidden"></div>

    <!-- Chat Box and Input (已激活) -->
    <div id="chatContainer" class="mb-4">
      <div id="chatBox" class="h-64 border p-2 mb-4 overflow-y-auto bg-white"></div>
      <div class="flex gap-2">
        <input id="chatInput" class="border p-2 w-full" placeholder="Type a message..." />
        <button id="sendBtn" class="bg-primary text-white px-4 py-2 rounded">Send</button>
      </div>
    </div>

    <!-- Sign Language Section -->
    <video id="preview" class="w-full rounded mb-4" autoplay muted></video>
    <div class="flex justify-between items-center mb-4">
      <button id="startRecordBtn" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">Start Recording</button>
      <button id="stopRecordBtn" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600" disabled>Stop Recording</button>
      <button id="uploadBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" disabled>Upload & Translate</button>
    </div>
    <div id="result" class="mt-4 text-center text-lg font-medium"></div>
  </div>

  <script type="module">
    const COLAB_URL = "https://236040286881.ngrok-free.app"; // 請更新為最新的 ngrok URL
    tailwind.config = { theme: { extend: { colors: { primary: '#3B82F6', secondary: '#60A5FA' } } } };

    document.addEventListener('DOMContentLoaded', () => {
      const roomsList = document.getElementById('roomsList');
      const currentRoomDiv = document.getElementById('currentRoom');
      const roomError = document.getElementById('roomError');
      const chatContainer = document.getElementById('chatContainer');
      const chatBox = document.getElementById('chatBox');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const preview = document.getElementById('preview');
      const startRecordBtn = document.getElementById('startRecordBtn');
      const stopRecordBtn = document.getElementById('stopRecordBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const result = document.getElementById('result');
      let stream;
      let mediaRecorder;
      let recordedBlobs = [];
      let socket = io(COLAB_URL, {
        path: '/socket.io',
        transports: ['websocket', 'polling'],
        reconnection: true,
        reconnectionAttempts: 15,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        timeout: 45000
      });
      let processedMessages = new Set(); // 防止消息重複顯示
      let processedTranslations = new Set(); // 防止翻譯重複顯示

      // 激活 Chatbox 和 Input
      chatContainer.style.display = 'block';
      chatInput.disabled = false;

      function showError(message) {
        roomError.textContent = message;
        roomError.classList.remove('hidden');
        setTimeout(() => roomError.classList.add('hidden'), 5000);
      }

      function addChatMessage(message, isSelf = false, isTranslated = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `mb-2 ${isSelf ? 'text-right' : 'text-left'}`;
        const spanClass = isSelf ? 'bg-primary text-white' : isTranslated ? 'bg-green-200' : 'bg-gray-200';
        messageDiv.innerHTML = `<span class="inline-block p-2 rounded ${spanClass}">${message}</span>`;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function createRoomCard(roomId, userCount = 0) {
        const full = userCount >= 2;
        const btnText = full ? 'Room Full' : 'Join Room';
        const btnClass = full ? 'bg-gray-400 cursor-not-allowed' : 'bg-primary hover:bg-secondary';
        const card = document.createElement('div');
        card.className = 'p-4 border rounded shadow';
        card.innerHTML = `
          <h2 class="text-xl font-bold mb-2">Room ${roomId}</h2>
          <p class="mb-2">Users: ${userCount} / 2</p>
          <button ${full ? 'disabled' : ''} class="text-white px-4 py-2 rounded ${btnClass} join-btn" data-room-id="${roomId}">${btnText}</button>
        `;
        roomsList.appendChild(card);
      }

      ['room1', 'room2'].forEach(roomId => createRoomCard(roomId));

      roomsList.addEventListener('click', (event) => {
        const button = event.target.closest('.join-btn');
        if (button && !button.disabled) {
          const roomId = button.getAttribute('data-room-id');
          currentRoomDiv.textContent = `Current Room: ${roomId}`;
          chatContainer.classList.remove('hidden');
          showError('✅ Joined room (simulated)!');
        }
      });

      socket.on('connect', () => {
        console.log('Connected to server, socket.connected:', socket.connected);
        addChatMessage('Connected to chat room', true);
      });

      socket.on('message', (data) => {
        const key = `${data.sid}-${data.msg}`; // 唯一標識符
        if (!processedMessages.has(key)) {
          processedMessages.add(key);
          addChatMessage(data.msg, data.sid === socket.id);
        }
      });

      socket.on('translation', (data) => {
        const key = `${data.user}-${data.gesture || data.error}`;
        if (!processedTranslations.has(key)) {
          processedTranslations.add(key);
          const message = `${data.user}: ${data.gesture || data.error || '未知结果'}`;
          addChatMessage(message, data.sid === socket.id, true);
          result.innerText = `✅ 翻译结果: ${data.gesture || data.error || '未知结果'}`;
        }
      });

      socket.on('connect_error', (error) => {
        console.error('Connection error:', error);
        showError(`⚠️ 连接到服务器失败: ${error.message}. 請檢查 COLAB_URL 或重新運行 Colab 代碼。`);
      });

      socket.on('disconnect', (reason) => {
        console.log('Disconnected:', reason);
        showError(`⚠️ Disconnected: ${reason}. 尝试自动重连...`);
      });

      sendBtn.addEventListener('click', () => {
        const msg = chatInput.value.trim();
        if (msg && socket.connected) {
          socket.emit('message', { msg, sid: socket.id });
          chatInput.value = ''; // 清空輸入框
        }
      });

      async function initCamera() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          preview.srcObject = stream;
          console.log('Camera started');
        } catch (err) {
          console.error('Failed to start webcam:', err);
          result.innerText = `❌ 无法访问摄像头: ${err.message}`;
          alert('请允许摄像头访问以继续！');
        }
      }

      startRecordBtn.onclick = () => {
        if (!stream) {
          initCamera().then(() => {
            if (stream && !mediaRecorder) {
              recordedBlobs = [];
              mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
              mediaRecorder.ondataavailable = (event) => {
                if (event.data.size > 0) recordedBlobs.push(event.data);
              };
              mediaRecorder.start(1000);
              startRecordBtn.disabled = true;
              stopRecordBtn.disabled = false;
              uploadBtn.disabled = true;
              result.innerText = "⏳ 正在录制...";
              console.log('Recording started');
            }
          }).catch(err => {
            showError(`❌ 录制初始化失败: ${err.message}`);
          });
        } else if (!mediaRecorder) {
          recordedBlobs = [];
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) recordedBlobs.push(event.data);
          };
          mediaRecorder.start(1000);
          startRecordBtn.disabled = true;
          stopRecordBtn.disabled = false;
          uploadBtn.disabled = true;
          result.innerText = "⏳ 正在录制...";
          console.log('Recording started');
        }
      };

      stopRecordBtn.onclick = () => {
        if (mediaRecorder) {
          mediaRecorder.stop();
          startRecordBtn.disabled = false;
          stopRecordBtn.disabled = true;
          uploadBtn.disabled = false;
          result.innerText = "✅ 录制完成，准备上传...";
          console.log('Recording stopped, blobs length:', recordedBlobs.length);
        }
      };

      uploadBtn.onclick = async () => {
        if (recordedBlobs.length) {
          const blob = new Blob(recordedBlobs, { type: 'video/webm' });
          const formData = new FormData();
          formData.append('video', blob, 'recording.mp4');
          result.innerText = "⏳ 正在上传并翻译...";
          try {
            const response = await fetch(`${COLAB_URL}/predict_colab`, {
              method: 'POST',
              body: formData,
              mode: 'cors'
            });
            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const resultData = await response.json();
            const translatedMessage = `User: ${resultData.gesture || resultData.error || '未知结果'}`;
            socket.emit('translation', { gesture: resultData.gesture, user: 'User', error: resultData.error, sid: socket.id });
          } catch (error) {
            console.error('Upload failed:', error);
            result.innerText = `❌ 上传失败: ${error.message}`;
          }
        } else {
          result.innerText = "❌ 请先录制视频！";
        }
      };

      window.addEventListener('beforeunload', () => {
        if (socket) socket.disconnect();
        if (stream) stream.getTracks().forEach(track => track.stop());
      });
    });
  </script>
</body>
</html>
