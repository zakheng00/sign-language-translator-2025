<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Language Translation System - Live Translation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }
    
    .video-container {
      position: relative;
      overflow: hidden;
      border-radius: 20px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      padding: 4px;
    }
    
    .video-inner {
      background: #000;
      border-radius: 16px;
      overflow: hidden;
    }
    
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transform: translateY(0);
    }
    
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .btn:hover:before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-start {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    
    .btn-stop {
      background: linear-gradient(135deg, #f59e0b, #d97706);
      color: white;
    }
    
    .btn-upload {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn:disabled:hover {
      transform: none;
      box-shadow: none;
    }
    
    .result-display {
      background: linear-gradient(135deg, #f8fafc, #e2e8f0);
      border: 2px solid transparent;
      background-clip: padding-box;
      border-radius: 16px;
      padding: 20px;
      position: relative;
      overflow: hidden;
    }
    
    .result-display::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: linear-gradient(135deg, #667eea, #764ba2);
      border-radius: 16px;
      z-index: -1;
      padding: 2px;
      mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      mask-composite: subtract;
    }
    
    .floating-shapes {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      top: 0;
      left: 0;
    }
    
    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 20%;
      right: 10%;
      animation-delay: 2s;
    }
    
    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .slide-in {
      animation: slideIn 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    
    .recording-pulse {
      animation: recordingPulse 1s ease-in-out infinite;
    }
    
    @keyframes recordingPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.6; }
    }
    
    .status-success {
      color: #059669;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    
    .status-error {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    
    .status-processing {
      color: #d97706;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
  </style>
</head>
<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-4xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2">
          🎥 Live Sign Language Translation
        </h1>
        <p class="text-gray-600 text-lg">
          Real-time sign language recognition and translation
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <div class="video-container mb-6">
        <div class="video-inner">
          <video id="preview" class="w-full aspect-video object-cover" autoplay muted></video>
        </div>
      </div>
      
      <div class="flex flex-wrap gap-4 justify-center mb-6 slide-in stagger-3">
        <button id="startBtn" class="btn btn-start">
          <span class="relative z-10">🎬 Start Recording</span>
        </button>
        <button id="stopBtn" class="btn btn-stop" disabled>
          <span class="relative z-10">⏹️ Stop Recording</span>
        </button>
        <button id="uploadBtn" class="btn btn-upload" disabled>
          <span class="relative z-10">🚀 Upload & Translate</span>
        </button>
      </div>
      
      <div id="result" class="result-display text-center text-lg font-medium slide-in stagger-4">
        <div class="text-gray-500">
          👋 Ready to translate sign language - Click "Start Recording" to begin
        </div>
      </div>
    </div>
    
    <div class="glass-card rounded-2xl p-6 slide-in stagger-4">
      <div class="text-center text-white/80">
        <p class="text-sm">
          💡 <strong>Tip:</strong> Ensure good lighting and clear hand gestures for best results
        </p>
      </div>
    </div>
  </div>

  <script>
    const COLAB_URL = "https://be3d2f08d2f6.ngrok-free.app/predict_colab"; // Make sure this is the latest ngrok URL
    let stream;
    let mediaRecorder;
    let recordedBlobs = [];

    function updateResult(message, type = 'default') {
      const resultEl = document.getElementById('result');
      resultEl.innerHTML = `<div class="text-${type === 'success' ? 'green' : type === 'error' ? 'red' : type === 'processing' ? 'yellow' : 'gray'}-600">${message}</div>`;
      
      // Add status classes
      resultEl.className = `result-display text-center text-lg font-medium slide-in stagger-4 ${
        type === 'success' ? 'status-success' : 
        type === 'error' ? 'status-error' : 
        type === 'processing' ? 'status-processing' : ''
      }`;
    }

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('preview').srcObject = stream;
        console.log('Camera started');
        updateResult('📹 Camera initialized successfully - Ready to record!', 'success');
      } catch (err) {
        updateResult(`❌ Cannot access camera: ${err.message}`, 'error');
        alert('Please allow camera access to continue!');
      }
    }

    document.getElementById('startBtn').onclick = () => {
      if (stream && !mediaRecorder) {
        recordedBlobs = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedBlobs.push(event.data);
        };
        mediaRecorder.start(1000);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('uploadBtn').disabled = true;
        updateResult('<div class="recording-pulse">🔴 Recording in progress...</div>', 'processing');
        console.log('Recording started');
      } else if (!stream) {
        initCamera().then(() => document.getElementById('startBtn').onclick());
      }
    };

    document.getElementById('stopBtn').onclick = () => {
      if (mediaRecorder) {
        mediaRecorder.stop();
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('uploadBtn').disabled = false;
        updateResult('✅ Recording completed successfully - Ready to upload!', 'success');
        console.log('Recording stopped, blobs length:', recordedBlobs.length);
      }
    };

    document.getElementById('uploadBtn').onclick = async () => {
      if (recordedBlobs.length) {
        const blob = new Blob(recordedBlobs, { type: 'video/webm' });
        const formData = new FormData();
        formData.append('video', blob, 'recording.mp4');
        updateResult('⏳ Uploading and translating...', 'processing');
        try {
          const response = await fetch(`${COLAB_URL}`, {
            method: 'POST',
            body: formData,
            mode: 'cors'
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const result = await response.json();
          updateResult(`🎉 Translation Result: ${result.gesture || result.error || 'Unknown result'}`, 'success');
        } catch (error) {
          console.error('Upload failed:', error);
          updateResult(`❌ Upload failed: ${error.message}`, 'error');
        }
      } else {
        updateResult('❌ Please record a video first!', 'error');
      }
    };

    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
    });

    initCamera();
  </script>
</body>
</html>
