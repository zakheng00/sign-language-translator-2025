<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Sign Language Translations</title>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/holistic/holistic.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    #video { border: 2px solid #000; transform: scaleX(-1); }
    #canvas { position: absolute; top: 100px; left: 50%; transform: translateX(-50%) scaleX(-1); }
    #output { margin-top: 20px; font-size: 24px; }
    #probabilities { margin-top: 10px; font-size: 16px; }
    #progress { margin-top: 10px; font-size: 18px; color: #555; }
    button { padding: 10px 20px; margin: 10px; font-size: 16px; }
    .disabled { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <h1>Real-Time Sign Language Translator</h1>
  <video id="video" width="640" height="480" autoplay></video>
  <canvas id="canvas" width="640" height="480"></canvas>
  <br>
  <button id="startBtn">Start</button>
  <button id="stopBtn" class="disabled">Stop</button>
  <button id="submitBtn" class="disabled">Translate</button>
  <div id="progress">Progress: 0%</div>
  <div id="output">Result: </div>
  <div id="probabilities">Probs: </div>

  <script>
    console.log('JavaScript running');
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    const startBtn = document.getElementById('startBtn');
    const stopBtn = document.getElementById('stopBtn');
    const submitBtn = document.getElementById('submitBtn');
    const progressDiv = document.getElementById('progress');
    const output = document.getElementById('output');
    const probabilitiesDiv = document.getElementById('probabilities');
    let frames = [];
    let capturing = false;
    const NUM_FRAMES = 30; // 保持 30 幀
    let frameCount = 0;
    let socket = io(); // Connect to Socket.IO server (optional if not using rooms)

    // Backend URL (adjust based on environment)
    const API_URL = window.location.hostname === 'localhost' ? 'http://localhost:5000' : 'https://sign-language-translator-2025.onrender.com';

    // Initialize MediaPipe Holistic
    const holistic = new Holistic({
      locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/holistic/${file}`
    });
    holistic.setOptions({
      modelComplexity: 1,
      minDetectionConfidence: 0.5,
      minTrackingConfidence: 0.5
    });

    // Draw keypoints
    function drawLandmarks(results) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      if (results.poseLandmarks) {
        for (const landmark of results.poseLandmarks) {
          const x = landmark.x * canvas.width;
          const y = landmark.y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = 'blue';
          ctx.fill();
        }
      }
      if (results.leftHandLandmarks) {
        for (const landmark of results.leftHandLandmarks) {
          const x = landmark.x * canvas.width;
          const y = landmark.y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = 'red';
          ctx.fill();
        }
      }
      if (results.rightHandLandmarks) {
        for (const landmark of results.rightHandLandmarks) {
          const x = landmark.x * canvas.width;
          const y = landmark.y * canvas.height;
          ctx.beginPath();
          ctx.arc(x, y, 3, 0, 2 * Math.PI);
          ctx.fillStyle = 'green';
          ctx.fill();
        }
      }
    }

    // Extract keypoints (adjusted to 42 dimensions from hands only)
    function extractKeypoints(results) {
      const leftHand = results.leftHandLandmarks 
        ? results.leftHandLandmarks.map(l => [l.x, l.y]).slice(0, 21) // 確保最多 21 個點
        : Array(21).fill([0, 0]);
      const rightHand = results.rightHandLandmarks 
        ? results.rightHandLandmarks.map(l => [l.x, l.y]).slice(0, 21) // 確保最多 21 個點
        : Array(21).fill([0, 0]);
      const keypoints = [...leftHand.flat(), ...rightHand.flat()];
      // 限制為 42 維（21 * 2），若不足補 0
      while (keypoints.length < 42) keypoints.push(0.0);
      return keypoints.slice(0, 42);
    }

    // Start webcam
    async function startWebcam() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        const camera = new Camera(video, {
          onFrame: async () => await holistic.send({ image: video }),
          width: 640,
          height: 480
        });
        await camera.start();
        console.log('MediaPipe camera started');
      } catch (err) {
        console.error('Failed to start webcam:', err);
        output.textContent = 'Error: Unable to access camera - ' + err.message';
        alert('Please allow camera access to continue!');
      }
    }

    // Capture frames with dynamic interval
    function captureFrame(results) {
      if (capturing && frames.length < NUM_FRAMES) {
        const keypoints = extractKeypoints(results);
        frames.push(keypoints);
        frameCount++;
        const progress = Math.round((frameCount / NUM_FRAMES) * 100);
        progressDiv.textContent = `Progress: ${progress}%`;
        console.log(`Captured frame ${frames.length}, keypoints length: ${keypoints.length}`);

        if (frames.length < NUM_FRAMES) {
          requestAnimationFrame(() => holistic.send({ image: video }));
        } else {
          stopRecording();
        }
      }
    }

    // Stop recording
    function stopRecording() {
      if (capturing) {
        capturing = false;
        frameCount = 0;
        startBtn.textContent = 'Start';
        stopBtn.classList.add('disabled');
        submitBtn.classList.remove('disabled');
        progressDiv.textContent = `Progress: 100%`;
        console.log(`Recording stopped, captured ${frames.length} frames`);
      }
    }

    // Submit to backend
    async function predict() {
      try {
        submitBtn.classList.add('disabled');
        progressDiv.textContent = 'Progress: Translating...';
        console.log('Sending to backend, frames:', frames.length);
        const response = await fetch(`${API_URL}/predict`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ frames })
        });
        if (!response.ok) throw new Error(`Backend error, status: ${response.status}`);
        const result = await response.json();
        if (result.error) {
          output.textContent = `Error: ${result.error}`;
        } else {
          output.textContent = `Your Result: ${result.gesture || 'Unknown'}`;
          probabilitiesDiv.textContent = `Probs: ${result.probabilities ? result.probabilities.map((p, i) => `${i}: ${p.toFixed(4)}`).join(', ') : 'N/A'}`;
        }
        frames = [];
      } catch (err) {
        console.error('Prediction failed:', err);
        output.textContent = `Error: Prediction failed - ${err.message}`;
        alert('Prediction failed, please try again.');
      } finally {
        submitBtn.classList.add('disabled');
        stopBtn.classList.add('disabled');
        progressDiv.textContent = 'Progress: 0%';
      }
    }

    // Handle MediaPipe results
    holistic.onResults((results) => {
      drawLandmarks(results);
      if (capturing) {
        captureFrame(results);
      }
    });

    // Button events
    startBtn.addEventListener('click', () => {
      if (!capturing) {
        capturing = true;
        frames = [];
        startBtn.textContent = 'Recording...';
        stopBtn.classList.remove('disabled');
        submitBtn.classList.add('disabled');
        progressDiv.textContent = 'Progress: 0%';
        console.log('Recording started');
        holistic.send({ image: video });
      }
    });

    stopBtn.addEventListener('click', stopRecording);
    submitBtn.addEventListener('click', predict);

    // Initialize
    startWebcam();
  </script>
</body>
</html>
