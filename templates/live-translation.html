<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="liveTranslation.title">Live Translation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/i18next@23.15.1/dist/umd/i18next.min.js"></script>
  <script src="https://unpkg.com/i18next-http-backend@2.5.1/i18nextHttpBackend.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.5/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }
    
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transform: translateY(0);
    }
    
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .btn:hover:before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn:disabled:hover {
      transform: none;
      box-shadow: none;
    }
    
    .floating-shapes {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      top: 0;
      left: 0;
    }
    
    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 20%;
      right: 10%;
      animation-delay: 2s;
    }
    
    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .slide-in {
      animation: slideIn 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    
    .status-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    
    .status-success {
      color: #059669;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    
    .status-error {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
  </style>
</head>
<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-4xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2" data-i18n="liveTranslation.title">
          Live Translation
        </h1>
        <p class="text-gray-600 text-lg" data-i18n="liveTranslation.description">
          Capture and translate sign language in real-time
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-4" data-i18n="liveTranslation.title">Live Translation</h2>
      <div id="statusBar" class="status-bar text-sm mb-4">
        <div class="flex items-center">
          <span>Status: Ready</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-4">
        <button id="startBtn" class="btn btn-primary" data-i18n="liveTranslation.start">Start Capture</button>
        <button id="stopBtn" class="btn btn-primary" disabled data-i18n="liveTranslation.stop">Stop Capture</button>
      </div>
      <video id="video" autoplay class="mt-4 w-full rounded-xl"></video>
      <div id="result" class="mt-4 p-4 bg-gray-100 rounded-xl" data-i18n="[placeholder]liveTranslation.result">Translation Result</div>
    </div>
  </div>

  <script type="module">
    // Server URL detection
    function detectServerUrl() {
      const currentHost = window.location.hostname;
      const currentProtocol = window.location.protocol;
      return `${currentProtocol}//${currentHost}`;
    }

    const FLASK_URL = detectServerUrl();
    const COLAB_URL = "https://7d1d03ca5ce8.ngrok-free.app";
    const socket = io(FLASK_URL, {
      transports: ['websocket'],
      cors_allowed_origins: ["https://sign-language-translator-2025.onrender.com"]
    });

    // Initialize i18next with HTTP backend
    i18next.use(i18nextHttpBackend).init({
      lng: 'en',
      backend: {
        loadPath: '/static/i18n/{{lng}}.json'
      }
    }, function(err, t) {
      if (err) {
        console.error('i18next initialization failed:', err);
        return;
      }
      updateContent();
    });

    function updateContent() {
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (key.startsWith('[placeholder]')) {
          element.placeholder = i18next.t(key.replace('[placeholder]', ''));
        } else {
          element.textContent = i18next.t(key);
        }
      });
      document.title = i18next.t('header');
    }

    async function fetchData(endpoint, options = {}) {
      try {
        const response = await fetch(endpoint, {
          ...options,
          headers: {
            'Content-Type': 'application/json',
            'Accept': 'application/json',
            'ngrok-skip-browser-warning': 'true',
            ...options.headers
          },
          mode: 'cors'
        });
        if (!response.ok) {
          throw new Error(`HTTP ${response.status}: ${await response.text()}`);
        }
        return await response.json();
      } catch (error) {
        console.error(`Fetch failed for ${endpoint}:`, error);
        throw error;
      }
    }

    async function loadCurrentLanguage() {
      try {
        const data = await fetchData(`${FLASK_URL}/api/settings`, { method: 'GET' });
        const lang = data.language === 'ms' ? 'ms' : 'en';
        i18next.changeLanguage(lang, (err) => {
          if (err) {
            console.error('Failed to change language:', err);
            return;
          }
          updateContent();
        });
      } catch (error) {
        console.error('Failed to load language settings:', error);
      }
    }

    socket.on('language_change', (data) => {
      const lang = data.language === 'ms' ? 'ms' : 'en';
      i18next.changeLanguage(lang, (err) => {
        if (err) {
          console.error('Failed to change language:', err);
          return;
        }
        updateContent();
      });
    });

    document.addEventListener('DOMContentLoaded', () => {
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const video = document.getElementById('video');
      const result = document.getElementById('result');
      const statusBar = document.getElementById('statusBar');

      let mediaRecorder;
      let recordedChunks = [];

      function updateStatus(message, type = 'default') {
        const statusIcon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
        statusBar.innerHTML = `
          <div class="flex items-center">
            <span class="mr-2">${statusIcon}</span>
            <span>${message}</span>
          </div>
        `;
        statusBar.className = `status-bar text-sm ${type === 'success' ? 'status-success' : type === 'error' ? 'status-error' : ''}`;
      }

      async function startCapture() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({ video: true });
          video.srcObject = stream;
          mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm;codecs=vp8' });
          recordedChunks = [];

          mediaRecorder.ondataavailable = (event) => {
            if (event.data.size > 0) {
              recordedChunks.push(event.data);
            }
          };

          mediaRecorder.onstop = async () => {
            const videoBlob = new Blob(recordedChunks, { type: 'video/webm' });
            const formData = new FormData();
            formData.append('video', videoBlob, 'capture.webm');

            try {
              const response = await fetchData(`${FLASK_URL}/predict_colab`, {
                method: 'POST',
                body: formData
              });
              if (response.error) {
                updateStatus(response.error, 'error');
              } else {
                result.textContent = `Gesture: ${response.gesture}`;
                updateStatus('Translation successful', 'success');
              }
            } catch (error) {
              updateStatus(`Translation failed: ${error.message}`, 'error');
            }

            stream.getTracks().forEach(track => track.stop());
            startBtn.disabled = false;
            stopBtn.disabled = true;
          };

          mediaRecorder.start();
          startBtn.disabled = true;
          stopBtn.disabled = false;
          updateStatus('Capturing...', 'default');
        } catch (error) {
          updateStatus(`Capture failed: ${error.message}`, 'error');
          startBtn.disabled = false;
          stopBtn.disabled = true;
        }
      }

      function stopCapture() {
        if (mediaRecorder && mediaRecorder.state === 'recording') {
          mediaRecorder.stop();
        }
      }

      startBtn.addEventListener('click', startCapture);
      stopBtn.addEventListener('click', stopCapture);

      // Initialize
      loadCurrentLanguage();
    });
  </script>
</body>
</html>
