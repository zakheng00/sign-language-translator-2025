<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>手语翻译系统</title>
</head>
<body>
  <h2>🎥 手语录制</h2>
  <video id="preview" autoplay muted></video>
  <br>
  <button id="startBtn">开始录制</button>
  <button id="stopBtn" disabled>停止</button>
  <button id="uploadBtn" disabled>翻译</button>
  <p id="result"></p>

  <script>
    let mediaRecorder;
    let recordedBlobs;

    const preview = document.getElementById("preview");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const result = document.getElementById("result");

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      preview.srcObject = stream;
      return stream;
    }

    startBtn.onclick = async () => {
      recordedBlobs = [];
      const stream = await initCamera();
      mediaRecorder = new MediaRecorder(stream, { mimeType: "video/webm" });

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) recordedBlobs.push(event.data);
      };

      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      uploadBtn.disabled = false;
    };

    uploadBtn.onclick = async () => {
      const blob = new Blob(recordedBlobs, { type: "video/webm" });
      const formData = new FormData();
      formData.append("video", blob, "recorded.webm");

      result.innerText = "⏳ 正在翻译，请稍候...";
      const response = await fetch("/predict", {
        method: "POST",
        body: formData,
      });

      const data = await response.json();
      result.innerText = "✅ 翻译结果：" + (data.prediction ?? data.error);
    };
  </script>
</body>
</html>
