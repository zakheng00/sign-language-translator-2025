<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手语翻译系统</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">手语翻译系统 ✌️</h1>
    <video id="preview" class="w-full rounded mb-4" autoplay muted></video>

    <div class="flex justify-between items-center mb-4">
      <button id="startBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Start Recording</button>
      <button id="stopBtn" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600" disabled>Stop</button>
      <button id="uploadBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" disabled>Translate</button>
    </div>

    <div id="result" class="mt-4 text-center text-lg font-medium"></div>
  </div>

  <script>
    let mediaRecorder;
    let recordedBlobs = [];
    const preview = document.getElementById("preview");
    const startBtn = document.getElementById("startBtn");
    const stopBtn = document.getElementById("stopBtn");
    const uploadBtn = document.getElementById("uploadBtn");
    const result = document.getElementById("result");

    async function initCamera() {
      const stream = await navigator.mediaDevices.getUserMedia({ video: true });
      preview.srcObject = stream;
      return stream;
    }

    startBtn.onclick = async () => {
      recordedBlobs = [];
      const stream = await initCamera();
      const mimeTypes = ["video/mp4", "video/webm"];
      let mimeType = mimeTypes.find(type => MediaRecorder.isTypeSupported(type)) || "video/webm";
      mediaRecorder = new MediaRecorder(stream, { mimeType });

      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) recordedBlobs.push(event.data);
      };

      mediaRecorder.start();
      startBtn.disabled = true;
      stopBtn.disabled = false;
      uploadBtn.disabled = true;
    };

    stopBtn.onclick = () => {
      mediaRecorder.stop();
      startBtn.disabled = false;
      stopBtn.disabled = true;
      uploadBtn.disabled = false;
    };

    uploadBtn.onclick = async () => {
      const blob = new Blob(recordedBlobs, { type: mediaRecorder.mimeType });
      const formData = new FormData();
      formData.append("video", blob, "recorded." + (mediaRecorder.mimeType.split('/')[1]));

      result.innerText = "⏳ 正在翻译，请稍候...";
      try {
        const response = await fetch("https://d7eed30228fc.ngrok-free.app/predict_colab", {
  method: "POST",
  body: formData,
});

        if (!response.ok) {
          throw new Error(`HTTP error! status: ${response.status}`);
        }

        const data = await response.json();
        result.innerText = "✅ 翻译结果：" + (data.gesture ?? data.error ?? "未知结果");
      } catch (err) {
        result.innerText = `❌ 翻译失败: ${err.message}`;
        console.error(err);
      }
    };
  </script>
</body>
</html>
