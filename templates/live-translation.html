<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Live Sign Language Translation</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.js"></script>
  <style>
    /* 假設與 index.html 相同的樣式 */
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }
    .button {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 12px 24px;
      border-radius: 12px;
      transition: all 0.3s ease;
    }
    .button:disabled {
      background: gray;
      cursor: not-allowed;
    }
    .button:hover:not(:disabled) {
      transform: scale(1.05);
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
    }
    .result-area {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: 12px;
      padding: 16px;
    }
  </style>
</head>
<body class="relative">
  <div class="relative z-10 max-w-6xl mx-auto p-8 space-y-12">
    <header class="text-center">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold text-white mb-4">Live Sign Language Translation</h1>
        <p class="text-xl text-white/80 max-w-2xl mx-auto leading-relaxed">
          Translate sign language in real-time using your webcam
        </p>
      </div>
    </header>
    <div class="flex flex-col items-center space-y-8">
      <video id="webcam" autoplay playsinline class="w-full max-w-md rounded-lg shadow-lg"></video>
      <div class="flex space-x-4">
        <button id="recordBtn" class="button">Record</button>
        <button id="stopBtn" class="button" disabled>Stop</button>
      </div>
      <div id="resultArea" class="result-area text-center text-lg font-medium text-gray-800">
        Translation result will appear here
      </div>
    </div>
  </div>

  <script type="module">
    // Inline translations object
    const TRANSLATIONS = {
      live_translation: {
        en: {
          title: "Live Sign Language Translation",
          subtitle: "Translate sign language in real-time using your webcam",
          recordBtn: "Record",
          stopBtn: "Stop",
          resultPlaceholder: "Translation result will appear here",
          errorNoWebcam: "No webcam access. Please grant permission or check your device.",
          errorRecording: "Recording failed. Please try again.",
          errorUpload: "Upload failed. Please try again."
        },
        ms: {
          title: "Terjemahan Bahasa Isyarat Langsung",
          subtitle: "Terjemahkan bahasa isyarat secara masa nyata menggunakan kamera web anda",
          recordBtn: "Rakam",
          stopBtn: "Berhenti",
          resultPlaceholder: "Keputusan terjemahan akan muncul di sini",
          errorNoWebcam: "Tiada akses kamera web. Sila benarkan kebenaran atau semak peranti anda.",
          errorRecording: "Rakaman gagal. Sila cuba lagi.",
          errorUpload: "Muat naik gagal. Sila cuba lagi."
        }
      }
    };

    // Language handling
    function applyLanguage(lang) {
      localStorage.setItem('language', lang);
      const translations = TRANSLATIONS.live_translation[lang];
      document.querySelector('h1').textContent = translations.title;
      document.querySelector('p').textContent = translations.subtitle;
      document.getElementById('recordBtn').textContent = translations.recordBtn;
      document.getElementById('stopBtn').textContent = translations.stopBtn;
      document.getElementById('resultArea').textContent = translations.resultPlaceholder;
      console.log(`Language changed to: ${lang}`);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      let currentLang = localStorage.getItem('language') || 'en';
      applyLanguage(currentLang);

      // Server URL detection
      const FLASK_URL = `${window.location.protocol}//${window.location.hostname}${window.location.port ? ':' + window.location.port : ''}`;

      // Initialize Socket.IO
      const socket = io(FLASK_URL, {
        path: '/socket.io',
        transports: ['websocket', 'polling']
      });

      socket.on('connect', () => {
        console.log('Socket connected to server');
      });

      socket.on('disconnect', () => {
        console.log('Socket disconnected from server');
      });

      socket.on('connect_error', (error) => {
        console.error('Socket connection error:', error);
      });

      socket.on('language_changed', (data) => {
        console.log('Received language change event:', data);
        applyLanguage(data.language);
      });

      socket.on('translation', (data) => {
        console.log('Received translation:', data);
        const resultArea = document.getElementById('resultArea');
        const translations = TRANSLATIONS.live_translation[currentLang];
        resultArea.textContent = data.text || translations.resultPlaceholder;
      });

      // Webcam and recording setup
      const video = document.getElementById('webcam');
      const recordBtn = document.getElementById('recordBtn');
      const stopBtn = document.getElementById('stopBtn');
      const resultArea = document.getElementById('resultArea');
      let mediaRecorder;
      let recordedChunks = [];

      // Initialize webcam
      async function initWebcam() {
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            video: { width: 640, height: 480, facingMode: 'user' },
            audio: false
          });
          video.srcObject = stream;
          video.play();
          console.log('Webcam initialized successfully');
        } catch (error) {
          console.error('Webcam initialization failed:', error);
          const translations = TRANSLATIONS.live_translation[currentLang];
          resultArea.textContent = translations.errorNoWebcam;
        }
      }

      // Start recording
      function startRecording() {
        recordedChunks = [];
        const stream = video.srcObject;
        if (!stream) {
          console.error('No stream available for recording');
          const translations = TRANSLATIONS.live_translation[currentLang];
          resultArea.textContent = translations.errorRecording;
          return;
        }

        mediaRecorder = new MediaRecorder(stream, {
          mimeType: 'video/webm;codecs=vp9'
        });

        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) {
            recordedChunks.push(event.data);
          }
        };

        mediaRecorder.onstop = async () => {
          const blob = new Blob(recordedChunks, { type: 'video/webm' });
          const formData = new FormData();
          formData.append('video', blob, 'recording.webm');

          try {
            console.log('Sending request to:', `${FLASK_URL}/predict`, 'Method: POST');
            const response = await fetch(`${FLASK_URL}/predict`, {
              method: 'POST',
              body: formData,
              headers: {
                'ngrok-skip-browser-warning': 'true'
              }
            });

            if (!response.ok) {
              throw new Error(`HTTP error! status: ${response.status}`);
            }

            const resultData = await response.json();
            console.log('Data respons:', resultData);

            if (resultData.error) {
              const translations = TRANSLATIONS.live_translation[currentLang];
              resultArea.textContent = `${translations.errorUpload}: ${resultData.error}`;
              return;
            }

            resultArea.textContent = resultData.translation || TRANSLATIONS.live_translation[currentLang].resultPlaceholder;
            socket.emit('translation', {
              text: resultData.translation,
              gesture: resultData.gesture,
              user: 'anonymous',
              sid: socket.id
            });
          } catch (error) {
            console.error('Upload failed:', error);
            const translations = TRANSLATIONS.live_translation[currentLang];
            resultArea.textContent = `${translations.errorUpload}: ${error.message}`;
          }
        };

        mediaRecorder.start();
        recordBtn.disabled = true;
        stopBtn.disabled = false;
        console.log('Recording started');
      }

      // Stop recording
      function stopRecording() {
        if (mediaRecorder && mediaRecorder.state !== 'inactive') {
          mediaRecorder.stop();
          recordBtn.disabled = false;
          stopBtn.disabled = true;
          console.log('Recording stopped');
        }
      }

      // Event listeners
      recordBtn.addEventListener('click', startRecording);
      stopBtn.addEventListener('click', stopRecording);

      // Initialize webcam on page load
      await initWebcam();
    });
  </script>
</body>
</html>
