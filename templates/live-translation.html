<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>手语翻译系统 - Live Translation</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">手语翻译系统 ✌️ - Live Translation</h1>
    <video id="preview" class="w-full rounded mb-4" autoplay muted></video>
    <div class="flex justify-between items-center mb-4">
      <button id="startBtn" class="bg-green-500 text-white px-4 py-2 rounded hover:bg-green-600">Start Recording</button>
      <button id="stopBtn" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600" disabled>Stop</button>
      <button id="uploadBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" disabled>Upload & Translate</button>
    </div>
    <div id="result" class="mt-4 text-center text-lg font-medium"></div>
  </div>

  <script>
    const COLAB_URL = "https://47e31c67464a.ngrok-free.app/predict_colab"; // 請確保這是最新的 ngrok URL
    let stream;
    let mediaRecorder;
    let recordedBlobs = [];

    async function initCamera() {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
        document.getElementById('preview').srcObject = stream;
        console.log('Camera started');
      } catch (err) {
        document.getElementById('result').innerText = `❌ 无法访问摄像头: ${err.message}`;
        alert('请允许摄像头访问以继续！');
      }
    }

    document.getElementById('startBtn').onclick = () => {
      if (stream && !mediaRecorder) {
        recordedBlobs = [];
        mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
        mediaRecorder.ondataavailable = (event) => {
          if (event.data.size > 0) recordedBlobs.push(event.data);
        };
        mediaRecorder.start(1000);
        document.getElementById('startBtn').disabled = true;
        document.getElementById('stopBtn').disabled = false;
        document.getElementById('uploadBtn').disabled = true;
        document.getElementById('result').innerText = "⏳ 正在录制...";
        console.log('Recording started');
      } else if (!stream) {
        initCamera().then(() => document.getElementById('startBtn').onclick());
      }
    };

    document.getElementById('stopBtn').onclick = () => {
      if (mediaRecorder) {
        mediaRecorder.stop();
        document.getElementById('startBtn').disabled = false;
        document.getElementById('stopBtn').disabled = true;
        document.getElementById('uploadBtn').disabled = false;
        document.getElementById('result').innerText = "✅ 录制完成，准备上传...";
        console.log('Recording stopped, blobs length:', recordedBlobs.length);
      }
    };

    document.getElementById('uploadBtn').onclick = async () => {
      if (recordedBlobs.length) {
        const blob = new Blob(recordedBlobs, { type: 'video/webm' });
        const formData = new FormData();
        formData.append('video', blob, 'recording.mp4');
        document.getElementById('result').innerText = "⏳ 正在上传并翻译...";
        try {
          const response = await fetch(`${COLAB_URL}`, { // 修正 URL
            method: 'POST',
            body: formData,
            mode: 'cors'
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const result = await response.json();
          document.getElementById('result').innerText = `✅ 翻译结果: ${result.gesture || result.error || '未知结果'}`;
        } catch (error) {
          console.error('Upload failed:', error);
          document.getElementById('result').innerText = `❌ 上传失败: ${error.message}`;
        }
      } else {
        document.getElementById('result').innerText = "❌ 请先录制视频！";
      }
    };

    window.addEventListener('beforeunload', () => {
      if (stream) stream.getTracks().forEach(track => track.stop());
    });

    initCamera();
  </script>
</body>
</html>
