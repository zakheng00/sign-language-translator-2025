<!DOCTYPE html>
<html lang="ms">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Terjemahan Bahasa Isyarat - Sejarah</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    * { font-family: 'Inter', system-ui, -apple-system, sans-serif; }
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transform: translateY(0);
    }
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    .btn:hover:before { left: 100%; }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .btn:active { transform: translateY(0); }
    .btn-refresh { background: linear-gradient(135deg, #10b981, #059669); color: white; }
    .btn-delete { background: linear-gradient(135deg, #ef4444, #dc2626); color: white; padding: 8px 16px; font-size: 14px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .btn:disabled:hover { transform: none; box-shadow: none; }
    .floating-shapes {
      position: fixed; width: 100%; height: 100%;
      overflow: hidden; pointer-events: none;
      z-index: 0; top: 0; left: 0;
    }
    .shape { position: absolute; background: rgba(255, 255, 255, 0.1); border-radius: 50%; animation: float 6s ease-in-out infinite; }
    .shape:nth-child(1) { width: 80px; height: 80px; top: 10%; left: 10%; animation-delay: 0s; }
    .shape:nth-child(2) { width: 120px; height: 120px; top: 20%; right: 10%; animation-delay: 2s; }
    .shape:nth-child(3) { width: 60px; height: 60px; bottom: 20%; left: 20%; animation-delay: 4s; }
    @keyframes float { 0%, 100% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(180deg); } }
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .slide-in { animation: slideIn 0.8s ease-out forwards; opacity: 0; transform: translateY(30px); }
    @keyframes slideIn { to { opacity: 1; transform: translateY(0); } }
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    .history-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    .history-card:hover { transform: translateY(-2px); box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15); }
    .status-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .status-success { color: #059669; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.2); }
    .status-error { color: #dc2626; background: rgba(220, 38, 38, 0.1); border: 1px solid rgba(220, 38, 38, 0.2); }
    .status-loading { color: #d97706; background: rgba(245, 158, 11, 0.1); border: 1px solid rgba(245, 158, 11, 0.2); }
    .gesture-badge { background: linear-gradient(135deg, #667eea, #764ba2); color: white; padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; display: inline-block; }
    .empty-state { text-align: center; padding: 60px 20px; color: #6b7280; }
    .empty-state-icon { font-size: 4rem; margin-bottom: 16px; }
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-6xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2" id="mainTitle">
          <span class="icon">📚</span> Sejarah Terjemahan
        </h1>
        <p class="text-gray-600 text-lg" id="mainSubtitle">
          Rekod terjemahan bahasa isyarat anda
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800" id="recentTranslationsTitle">Terjemahan Terkini</h2>
        <button id="refreshBtn" class="btn btn-refresh">
          <span class="relative z-10"><span class="icon">🔄</span> Segar semula</span>
        </button>
      </div>
      
      <div id="statusBar" class="status-bar text-sm">
        <div class="flex items-center">
          <div class="loading-spinner w-4 h-4 mr-2"></div>
          <span id="statusText">Sedang memuatkan sejarah terjemahan...</span>
        </div>
      </div>
      
      <div id="historyList" class="space-y-4">
        <div class="flex justify-center items-center py-12" id="loadingIndicator">
          <div class="loading-spinner"></div>
          <span class="ml-4 text-gray-600 text-lg" id="loadingText">Sedang memuatkan sejarah...</span>
        </div>
      </div>
      
      <div id="pagination" class="mt-8 flex justify-center">
        <!-- Pagination controls will be added here -->
      </div>
    </div>
    
    <div class="glass-card rounded-2xl p-6 slide-in stagger-3">
      <div class="text-center text-gray-600">
        <p class="text-sm" id="tipText">
          <span class="icon">💡</span> <strong>Petua:</strong> Sejarah terjemahan anda disimpan secara automatik dan boleh diakses pada bila-bila masa
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    const TRANSLATIONS = {
      history: {
        ms: {
          title: "Sejarah Terjemahan",
          subtitle: "Rekod terjemahan bahasa isyarat anda",
          recentTranslationsTitle: "Terjemahan Terkini",
          refreshButton: "Segar semula",
          statusLoading: "Sedang memuatkan sejarah terjemahan...",
          statusSuccess: "Berjaya memuatkan {count} rekod terjemahan",
          statusError: "Gagal memuatkan sejarah: {error}",
          loadingText: "Sedang memuatkan sejarah...",
          tipText: "Petua: Sejarah terjemahan anda disimpan secara automatik dan boleh diakses pada bila-bila masa",
          emptyStateTitle: "Tiada Sejarah Terjemahan",
          emptyStateText: "Mula menterjemah bahasa isyarat untuk melihat sejarah di sini",
          startTranslatingButton: "Mula Terjemah",
          errorStateTitle: "Gagal Memuatkan Sejarah",
          errorStateText: "{error}",
          errorChecklist: "Sila periksa:",
          errorCheckServer: "URL Pelayan: {url}",
          errorCheckNetwork: "Sambungan rangkaian",
          errorCheckAvailability: "Ketersediaan pelayan",
          retryButton: "Cuba semula",
          userLabel: "Pengguna",
          videoIdLabel: "ID Video",
          translationLabel: "Terjemahan",
          deleteConfirm: "Adakah anda pasti mahu memadam rekod terjemahan ini?",
          deleteSuccess: "Rekod berjaya dipadam!",
          deleteError: "Gagal memadam rekod: {error}"
        }
      }
    };

    function applyLanguage(lang) {
      localStorage.setItem('language', lang);
      const translations = TRANSLATIONS.history[lang];
      document.title = `Sistem Terjemahan Bahasa Isyarat - ${translations.title}`;
      document.getElementById('mainTitle').innerHTML = `<span class="icon">📚</span> ${translations.title}`;
      document.getElementById('mainSubtitle').textContent = translations.subtitle;
      document.getElementById('recentTranslationsTitle').textContent = translations.recentTranslationsTitle;
      document.getElementById('refreshBtn').querySelector('span').innerHTML = `<span class="icon">🔄</span> ${translations.refreshButton}`;
      document.getElementById('statusText').textContent = translations.statusLoading;
      document.getElementById('loadingText').textContent = translations.loadingText;
      document.getElementById('tipText').innerHTML = `<span class="icon">💡</span> <strong>${translations.tipText.split(':')[0]}:</strong> ${translations.tipText.split(':')[1]}`;
      console.log(`Bahasa telah ditukar kepada: ${lang}`);
    }

    document.addEventListener('DOMContentLoaded', () => {
      console.log('history.html DOM telah dimuatkan sepenuhnya');
      let currentLang = localStorage.getItem('language') || 'ms';
      applyLanguage(currentLang);
      // ... (Kod JavaScript lain kekal sama)
    });
  </script>
</body>
</html>
