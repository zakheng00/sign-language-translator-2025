<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Language Translation System - History</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }
    
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transform: translateY(0);
    }
    
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .btn:hover:before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-refresh {
      background: linear-gradient(135deg, #10b981, #059669);
      color: white;
    }
    
    .btn-delete {
      background: linear-gradient(135deg, #ef4444, #dc2626);
      color: white;
      padding: 8px 16px;
      font-size: 14px;
    }
    
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    
    .btn:disabled:hover {
      transform: none;
      box-shadow: none;
    }
    
    .floating-shapes {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      top: 0;
      left: 0;
    }
    
    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 20%;
      right: 10%;
      animation-delay: 2s;
    }
    
    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .slide-in {
      animation: slideIn 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .stagger-3 { animation-delay: 0.3s; }
    .stagger-4 { animation-delay: 0.4s; }
    
    .history-card {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 16px;
      transition: all 0.3s ease;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
    }
    
    .history-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.15);
    }
    
    .status-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    
    .status-success {
      color: #059669;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    
    .status-error {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    
    .status-loading {
      color: #d97706;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    
    .gesture-badge {
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      display: inline-block;
    }
    
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }
    
    .empty-state-icon {
      font-size: 4rem;
      margin-bottom: 16px;
    }
    
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-6xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2">
          📚 Translation History
        </h1>
        <p class="text-gray-600 text-lg">
          Your sign language translation records
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-800">Recent Translations</h2>
        <button id="refreshBtn" class="btn btn-refresh">
          <span class="relative z-10">🔄 Refresh</span>
        </button>
      </div>
      
      <div id="statusBar" class="status-bar text-sm">
        <div class="flex items-center">
          <div class="loading-spinner w-4 h-4 mr-2"></div>
          <span>Loading translation history...</span>
        </div>
      </div>
      
      <div id="historyList" class="space-y-4">
        <div class="flex justify-center items-center py-12" id="loadingIndicator">
          <div class="loading-spinner"></div>
          <span class="ml-4 text-gray-600 text-lg">Loading history...</span>
        </div>
      </div>
      
      <div id="pagination" class="mt-8 flex justify-center">
        <!-- Pagination controls will be added here -->
      </div>
    </div>
    
    <div class="glass-card rounded-2xl p-6 slide-in stagger-3">
      <div class="text-center text-gray-600">
        <p class="text-sm">
          💡 <strong>Tip:</strong> Your translation history is automatically saved and can be accessed anytime
        </p>
      </div>
    </div>
  </div>

  <script type="module">
    // Server URL detection
    function detectServerUrl() {
      const currentHost = window.location.hostname;
      const currentProtocol = window.location.protocol;
      return `${currentProtocol}//${currentHost}`;
    }

    const FLASK_URL = detectServerUrl();
    const COLAB_URL = "https://05e138f0d96c.ngrok-free.app";
    const ENDPOINTS = {
      HISTORY: `${COLAB_URL}/api/history`,
      DELETE: `${COLAB_URL}/api/delete_history`,
      HEALTH: `${COLAB_URL}/health`
    };

    // Sign language gesture mapping
    const GESTURE_MAPPING = {
      18: "Hello",
      11: "Thank You",
      7: "I Love You",
      8: "Yes",
      19: "Good Bye",
      16: "Sorry",
      0: "Unknown"
    };

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');
      const refreshBtn = document.getElementById('refreshBtn');
      const statusBar = document.getElementById('statusBar');
      const loadingIndicator = document.getElementById('loadingIndicator');

      if (!historyList || !refreshBtn || !statusBar || !loadingIndicator) {
        console.error('One or more DOM elements not found');
        return;
      }

      function updateStatus(message, type = 'loading') {
        const statusIcon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⏳';
        statusBar.innerHTML = `
          <div class="flex items-center">
            ${type === 'loading' ? '<div class="loading-spinner w-4 h-4 mr-2"></div>' : `<span class="mr-2">${statusIcon}</span>`}
            <span>${message}</span>
          </div>
        `;
        statusBar.className = `status-bar text-sm ${
          type === 'success' ? 'status-success' : 
          type === 'error' ? 'status-error' : 
          'status-loading'
        }`;
      }

      function showLoading(isLoading) {
        loadingIndicator.style.display = isLoading ? 'flex' : 'none';
      }

      async function fetchData(endpoint, options = {}) {
        try {
          const response = await fetch(endpoint, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'ngrok-skip-browser-warning': 'true',
              ...options.headers
            },
            mode: 'cors',
            timeout: 10000
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          }

          const contentType = response.headers.get('content-type');
          if (contentType && contentType.includes('application/json')) {
            const data = await response.json();
            console.log(`Fetched data from ${endpoint}:`, data);
            return data;
          } else {
            const text = await response.text();
            if (text.includes('ngrok')) {
              throw new Error('ngrok browser warning detected - check server configuration');
            }
            throw new Error('Invalid response format: ' + text.substring(0, 100));
          }
        } catch (error) {
          console.error(`Fetch failed for ${endpoint}:`, error);
          throw error;
        }
      }

      async function fetchHistory() {
        showLoading(true);
        try {
          updateStatus('Loading translation history...');
          const history = await fetchData(ENDPOINTS.HISTORY, { method: 'GET' });
          console.log('History response:', history);
          displayHistory(history);
          updateStatus(`Successfully loaded ${Array.isArray(history) ? history.length : 0} translation records`, 'success');
        } catch (error) {
          console.error('Fetch error details:', error);
          updateStatus(`Failed to load history: ${error.message}`, 'error');
          displayErrorState(error);
        } finally {
          showLoading(false);
        }
      }

      function displayHistory(history) {
        if (!Array.isArray(history) || history.length === 0) {
          historyList.innerHTML = `
            <div class="empty-state">
              <div class="empty-state-icon">📝</div>
              <h3 class="text-xl font-semibold mb-2">No Translation History</h3>
              <p class="text-gray-500 mb-4">Start translating sign language to see your history here</p>
              <a href="./live-translation.html" class="btn btn-refresh inline-block">
                <span class="relative z-10">🎬 Start Translating</span>
              </a>
            </div>
          `;
          return;
        }

        historyList.innerHTML = '';
        history.forEach((record, index) => {
          const item = document.createElement('div');
          item.className = 'history-card slide-in';
          item.style.animationDelay = `${index * 0.1}s`;
          
          const gestureText = GESTURE_MAPPING[record.gesture] || 'Unknown';
          const displayText = record.text || (record.gesture ? gestureText : 'N/A');
          
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <div class="flex items-center mb-4">
                  <div class="gesture-badge mr-3">
                    ${gestureText} (${record.gesture || 'N/A'})
                  </div>
                  <span class="text-sm text-gray-500">
                    ${formatTimestamp(record.timestamp)}
                  </span>
                </div>
                
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-4">
                  <div>
                    <p class="text-sm font-medium text-gray-700 mb-1">👤 User</p>
                    <p class="text-gray-800">${record.user || 'Anonymous'}</p>
                  </div>
                  <div>
                    <p class="text-sm font-medium text-gray-700 mb-1">🎥 Video ID</p>
                    <p class="text-gray-600 text-sm font-mono">${record.video_id || 'N/A'}</p>
                  </div>
                </div>
                
                <div>
                  <p class="text-sm font-medium text-gray-700 mb-2">💬 Translation</p>
                  <p class="text-gray-800 bg-gray-50 p-3 rounded-lg">${displayText}</p>
                </div>
              </div>
              
              <button onclick="deleteRecord('${record.id || ''}')" 
                      class="btn btn-delete ml-4" 
                      ${!record.id ? 'disabled' : ''}
                      title="Delete this record">
                <span class="relative z-10">🗑️</span>
              </button>
            </div>
          `;
          historyList.appendChild(item);
        });
      }

      function displayErrorState(error) {
        historyList.innerHTML = `
          <div class="empty-state">
            <div class="empty-state-icon">❌</div>
            <h3 class="text-xl font-semibold mb-2 text-red-600">Failed to Load History</h3>
            <p class="text-gray-600 mb-4">${error.message}</p>
            <div class="text-sm text-gray-500 mb-6">
              <p class="mb-2">Please check:</p>
              <ul class="list-disc list-inside space-y-1">
                <li>Server URL: ${COLAB_URL}</li>
                <li>Network connection</li>
                <li>Server availability</li>
              </ul>
            </div>
            <button onclick="fetchHistory()" class="btn btn-refresh">
              <span class="relative z-10">🔄 Retry</span>
            </button>
          </div>
        `;
      }

      function formatTimestamp(timestamp) {
        try {
          const date = new Date(timestamp);
          return date.toLocaleString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit',
            second: '2-digit'
          });
        } catch {
          return timestamp || 'N/A';
        }
      }

      window.deleteRecord = async function(recordId) {
        if (!recordId || !confirm('Are you sure you want to delete this translation record?')) {
          return;
        }
        
        try {
          updateStatus(`Deleting record...`);
          const result = await fetchData(`${ENDPOINTS.DELETE}/${recordId}`, { method: 'DELETE' });
          updateStatus('Record deleted successfully!', 'success');
          setTimeout(() => fetchHistory(), 500);
        } catch (error) {
          updateStatus(`Failed to delete record: ${error.message}`, 'error');
        }
      };

      window.fetchHistory = fetchHistory;

      refreshBtn.addEventListener('click', fetchHistory);

      // Initialize
      fetchHistory();
    });
  </script>
</body>
</html>
