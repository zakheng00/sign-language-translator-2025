<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translation History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">Translation History</h1>
    <div id="historyList" class="space-y-4"></div>
  </div>

  <script type="module">
    const COLAB_URL = "https://262a79671c64.ngrok-free.app"; // 根據您的 ngrok URL 更新
    const HISTORY_ENDPOINT = `${COLAB_URL}/history`;

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');

      async function fetchHistory() {
        try {
          console.log(`Fetching from: ${HISTORY_ENDPOINT}`); // 診斷 URL
          const response = await fetch(HISTORY_ENDPOINT, {
            method: 'GET',
            // 暫時移除 credentials 以測試
            // credentials: 'include'
          });
          console.log(`Response status: ${response.status}`); // 診斷狀態
          if (!response.ok) {
            const errorText = await response.text();
            throw new Error(`HTTP error! status: ${response.status}, message: ${errorText}`);
          }
          const history = await response.json();
          historyList.innerHTML = ''; // 清空列表
          history.forEach(record => {
            const item = document.createElement('div');
            item.className = 'p-4 border rounded shadow';
            item.innerHTML = `
              <p><strong>User:</strong> ${record.user || 'Unknown'}</p>
              <p><strong>Text:</strong> ${record.text || 'N/A'}</p>
              <p><strong>Gesture:</strong> ${record.gesture || 'N/A'}</p>
              <p><strong>Error:</strong> ${record.error || 'None'}</p>
              <p><strong>Time:</strong> ${new Date(record.timestamp).toLocaleString()}</p>
              ${record.video ? `<video controls><source id="videoSource_${record.timestamp}" type="video/mp4"></video><br>` : ''}
              ${record.audio ? `<audio controls><source id="audioSource_${record.timestamp}" type="audio/wav"></audio><br>` : ''}
              <button id="downloadVideoBtn_${record.timestamp}" class="bg-blue-500 text-white px-2 py-1 rounded ${record.video ? '' : 'hidden'}">Download Video</button>
              <button id="downloadAudioBtn_${record.timestamp}" class="bg-green-500 text-white px-2 py-1 rounded ${record.audio ? '' : 'hidden'}">Download Audio</button>
            `;
            historyList.appendChild(item);

            if (record.video) {
              const videoSource = document.getElementById(`videoSource_${record.timestamp}`);
              const byteCharacters = atob(record.video);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: 'video/mp4' });
              videoSource.src = URL.createObjectURL(blob);
              const downloadVideoBtn = document.getElementById(`downloadVideoBtn_${record.timestamp}`);
              downloadVideoBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = videoSource.src;
                a.download = `video_${record.timestamp}.mp4`;
                a.click();
              };
            }
            if (record.audio) {
              const audioSource = document.getElementById(`audioSource_${record.timestamp}`);
              const byteCharacters = atob(record.audio);
              const byteNumbers = new Array(byteCharacters.length);
              for (let i = 0; i < byteCharacters.length; i++) {
                byteNumbers[i] = byteCharacters.charCodeAt(i);
              }
              const byteArray = new Uint8Array(byteNumbers);
              const blob = new Blob([byteArray], { type: 'audio/wav' });
              audioSource.src = URL.createObjectURL(blob);
              const downloadAudioBtn = document.getElementById(`downloadAudioBtn_${record.timestamp}`);
              downloadAudioBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = audioSource.src;
                a.download = `audio_${record.timestamp}.wav`;
                a.click();
              };
            }
          });
        } catch (error) {
          console.error('Failed to fetch history:', error);
          historyList.innerHTML = `<p class="text-red-500">Failed to load history. Error: ${error.message}</p>`;
        }
      }

      fetchHistory(); // 初始加載
      setInterval(fetchHistory, 30000); // 每 30 秒刷新
    });
  </script>
</body>
</html>
