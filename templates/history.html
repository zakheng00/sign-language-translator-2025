<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>翻譯歷史紀錄</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-3xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">📜 翻譯歷史紀錄</h1>
    <div id="historyList" class="space-y-4"></div>
  </div>

  <script>
    const BACKEND_URL = window.location.origin; // 自動從後端抓
    const HISTORY_ENDPOINT = `${BACKEND_URL}/history`;

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');

      async function fetchHistory() {
        try {
          const response = await fetch(HISTORY_ENDPOINT, {
            method: 'GET',
            credentials: 'include'
          });
          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const history = await response.json();
          historyList.innerHTML = '';

          history.forEach(record => {
            const item = document.createElement('div');
            item.className = 'p-4 border rounded shadow bg-gray-50';

            const timestamp = new Date(record.timestamp).toLocaleString();
            const videoBlobUrl = record.video ? URL.createObjectURL(base64ToBlob(record.video, 'video/mp4')) : null;
            const audioBlobUrl = record.audio ? URL.createObjectURL(base64ToBlob(record.audio, 'audio/wav')) : null;

            item.innerHTML = `
              <p><strong>🧑 使用者:</strong> ${record.user || 'Unknown'}</p>
              <p><strong>📝 語音內容:</strong> ${record.text || 'N/A'}</p>
              <p><strong>🤟 手語翻譯:</strong> ${record.gesture || 'N/A'}</p>
              <p><strong>⚠️ 錯誤訊息:</strong> ${record.error || 'None'}</p>
              <p><strong>🕒 時間:</strong> ${timestamp}</p>
              ${videoBlobUrl ? `<video controls class="w-full mt-2 mb-1"><source src="${videoBlobUrl}" type="video/mp4"></video>` : ''}
              ${audioBlobUrl ? `<audio controls class="w-full mb-1"><source src="${audioBlobUrl}" type="audio/wav"></audio>` : ''}
              ${videoBlobUrl ? `<a href="${videoBlobUrl}" download="video_${timestamp}.mp4" class="bg-blue-500 text-white px-3 py-1 rounded mr-2 inline-block">下載影片</a>` : ''}
              ${audioBlobUrl ? `<a href="${audioBlobUrl}" download="audio_${timestamp}.wav" class="bg-green-500 text-white px-3 py-1 rounded inline-block">下載音訊</a>` : ''}
            `;

            historyList.appendChild(item);
          });
        } catch (error) {
          console.error('❌ 無法取得歷史紀錄:', error);
          historyList.innerHTML = '<p class="text-red-500">❌ 無法載入歷史紀錄，請查看主控台</p>';
        }
      }

      function base64ToBlob(base64, mimeType) {
        const byteChars = atob(base64);
        const byteNumbers = new Array(byteChars.length);
        for (let i = 0; i < byteChars.length; i++) {
          byteNumbers[i] = byteChars.charCodeAt(i);
        }
        return new Blob([new Uint8Array(byteNumbers)], { type: mimeType });
      }

      fetchHistory();
    });
  </script>
</body>
</html>
