<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translation History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-4xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <div class="flex justify-between items-center mb-6">
      <h1 class="text-3xl font-bold text-gray-800">Translation History</h1>
      <div class="flex space-x-2">
        <button id="testBtn" class="bg-purple-500 hover:bg-purple-600 text-white px-4 py-2 rounded transition-colors">
          Test Connection
        </button>
        <button id="refreshBtn" class="bg-green-500 hover:bg-green-600 text-white px-4 py-2 rounded transition-colors">
          Refresh
        </button>
        <button id="saveBtn" class="bg-blue-500 hover:bg-blue-600 text-white px-4 py-2 rounded transition-colors">
          Save Test Data
        </button>
      </div>
    </div>
    
    <div id="statusBar" class="mb-4 p-3 rounded bg-gray-50 text-sm text-gray-600">
      Status: Loading...
    </div>
    
    <div id="connectionInfo" class="mb-4 p-3 rounded bg-blue-50 text-sm text-blue-600">
      <div id="serverUrl">Server URL: <span id="currentUrl">Loading...</span></div>
      <div id="lastCheck">Last Check: <span id="lastCheckTime">Never</span></div>
    </div>
    
    <div id="historyList" class="space-y-4">
      <div class="flex justify-center items-center py-8">
        <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-500"></div>
        <span class="ml-2 text-gray-600">Loading...</span>
      </div>
    </div>
    
    <div id="pagination" class="mt-6 flex justify-center">
      <!-- Pagination controls will be added here -->
    </div>
  </div>

  <script type="module">
    // Server URL detection
    function detectServerUrl() {
      const currentHost = window.location.hostname;
      const currentProtocol = window.location.protocol;
      return `${currentProtocol}//${currentHost}`; // Use Render domain
    }

    // 定義 Colab 和 Render 的 URL
    const FLASK_URL = detectServerUrl(); // Render URL
    const COLAB_URL = "https://1a0966a6764e.ngrok-free.app"; // 硬編碼 Colab ngrok URL，需根據實際情況更新
    const HISTORY_ENDPOINT = `${COLAB_URL}/api/history`;
    const SAVE_ENDPOINT = `${COLAB_URL}/api/save_history`;
    const DELETE_ENDPOINT = `${COLAB_URL}/api/delete_history`;
    const HEALTH_ENDPOINT = `${FLASK_URL}/health`;
    const TEST_ENDPOINT = `${FLASK_URL}/test`;

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');
      const saveBtn = document.getElementById('saveBtn');
      const refreshBtn = document.getElementById('refreshBtn');
      const testBtn = document.getElementById('testBtn');
      const statusBar = document.getElementById('statusBar');
      const currentUrlSpan = document.getElementById('currentUrl');
      const lastCheckTimeSpan = document.getElementById('lastCheckTime');

      // 確保元素存在
      if (!historyList || !saveBtn || !refreshBtn || !testBtn || !statusBar || !currentUrlSpan || !lastCheckTimeSpan) {
        console.error('One or more DOM elements not found');
        return;
      }

      currentUrlSpan.textContent = FLASK_URL;

      function updateStatus(message, isError = false) {
        statusBar.textContent = `Status: ${message}`;
        statusBar.className = isError 
          ? 'mb-4 p-3 rounded bg-red-50 text-sm text-red-600'
          : 'mb-4 p-3 rounded bg-green-50 text-sm text-green-600';
      }

      function updateLastCheck() {
        lastCheckTimeSpan.textContent = new Date().toLocaleTimeString();
      }

      async function testConnection() {
        try {
          updateStatus('Testing connection...');
          console.log(`Testing: ${TEST_ENDPOINT}`);
          const response = await fetch(TEST_ENDPOINT, { method: 'GET', headers: { 'Content-Type': 'application/json' } });
          console.log(`Test status: ${response.status}`);
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${response.statusText}`);
          const result = await response.json();
          console.log('Test result:', result);
          updateStatus(`✅ Connection successful! Server: ${result.message}`);
          updateLastCheck();
        } catch (error) {
          console.error('Test failed:', error);
          updateStatus(`❌ Connection failed: ${error.message}`, true);
          updateLastCheck();
        }
      }

      async function fetchHistory() {
        try {
          updateStatus('Loading history...');
          console.log(`Fetching from: ${HISTORY_ENDPOINT}`);
          const response = await fetch(HISTORY_ENDPOINT, { 
            method: 'GET', 
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' } 
          });
          console.log(`Fetch status: ${response.status}, Response:`, await response.text());
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          const history = await response.json();
          console.log('Parsed history:', history);
          displayHistory(history);
          updateStatus(`✅ Loaded ${history.length} records`);
          updateLastCheck();
        } catch (error) {
          console.error('Fetch failed:', error);
          updateStatus(`❌ Failed to load history: ${error.message}`, true);
          updateLastCheck();
          historyList.innerHTML = `
            <div class="text-center py-8">
              <div class="text-red-500 text-lg mb-2">❌ Failed to load history</div>
              <div class="text-gray-600 mb-4">${error.message}</div>
              <div class="space-x-2">
                <button onclick="testConnection()" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">
                  Test Connection
                </button>
                <button onclick="fetchHistory()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                  Retry
                </button>
              </div>
            </div>
          `;
        }
      }

      function displayHistory(history) {
        if (!Array.isArray(history) || history.length === 0) {
          historyList.innerHTML = `
            <div class="text-center py-8 text-gray-500">
              <div class="text-4xl mb-4">📝</div>
              <div class="text-lg">No translation history found</div>
              <div class="text-sm">Start translating or add test data to see history</div>
              <div class="mt-4">
                <button onclick="saveTestData()" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600">
                  Add Test Data
                </button>
              </div>
            </div>
          `;
          return;
        }
        historyList.innerHTML = '';
        history.forEach(record => {
          const item = document.createElement('div');
          item.className = 'p-4 border border-gray-200 rounded-lg shadow-sm hover:shadow-md transition-shadow bg-white';
          item.innerHTML = `
            <div class="flex justify-between items-start">
              <div class="flex-1">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                  <div><p class="text-sm text-gray-500 mb-1">User</p><p class="font-medium">${record.user || 'Unknown'}</p></div>
                  <div><p class="text-sm text-gray-500 mb-1">Gesture</p><p class="font-medium">${record.gesture || 'N/A'}</p></div>
                </div>
                <div class="mt-3"><p class="text-sm text-gray-500 mb-1">Text</p><p class="text-gray-800">${record.text || 'N/A'}</p></div>
                <div class="mt-3"><p class="text-sm text-gray-500 mb-1">Time</p><p class="text-sm text-gray-600">${formatTimestamp(record.timestamp)}</p></div>
                ${record.video_id ? `<div class="mt-3"><p class="text-sm text-gray-500 mb-1">Video ID</p><p class="text-gray-800">${record.video_id}</p></div>` : ''}
                ${record.audio_text ? `<div class="mt-3"><p class="text-sm text-gray-500 mb-1">Audio Text</p><p class="text-gray-800">${record.audio_text}</p></div>` : ''}
              </div>
              <button onclick="deleteRecord(${record.id})" class="ml-4 text-red-500 hover:text-red-700 transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                </svg>
              </button>
            </div>
          `;
          historyList.appendChild(item);
        });
      }

      function formatTimestamp(timestamp) {
        try {
          const date = new Date(timestamp);
          return date.toLocaleString('en-US', {
            year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', second: '2-digit'
          });
        } catch { return timestamp; }
      }

      async function saveTestData() {
        const testData = {
          user: "test_user",
          text: `Translated: Test video ${new Date().toLocaleTimeString()}`,
          gesture: Math.floor(Math.random() * 10) + 1,
          timestamp: new Date().toISOString(),
          video_id: `video_${Math.floor(Math.random() * 1000)}`,
          audio_text: `Speech: Test audio ${new Date().toLocaleTimeString()}`
        };

        try {
          updateStatus('Saving test data...');
          console.log(`Saving to: ${SAVE_ENDPOINT}`, testData);
          const response = await fetch(SAVE_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            body: JSON.stringify(testData)
          });
          const result = await response.json();
          console.log(`Save response:`, result);
          if (!response.ok) throw new Error(result.error || `Save failed: ${response.status}`);
          updateStatus('✅ Test data saved successfully!');
          updateLastCheck();
          setTimeout(() => fetchHistory(), 500);
        } catch (error) {
          console.error('Save failed:', error);
          updateStatus(`❌ Failed to save: ${error.message}`, true);
          updateLastCheck();
        }
      }

      window.deleteRecord = async function(recordId) {
        if (!confirm('Are you sure you want to delete this record?')) return;
        try {
          updateStatus(`Deleting record ${recordId}...`);
          const response = await fetch(`${DELETE_ENDPOINT}/${recordId}`, { method: 'DELETE' });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || `Delete failed: ${response.status}`);
          updateStatus('✅ Record deleted successfully!');
          updateLastCheck();
          setTimeout(() => fetchHistory(), 500);
        } catch (error) {
          console.error('Delete failed:', error);
          updateStatus(`❌ Failed to delete: ${error.message}`, true);
          updateLastCheck();
        }
      };

      async function checkHealth() {
        try {
          const response = await fetch(HEALTH_ENDPOINT);
          const health = await response.json();
          console.log('Health check:', health);
        } catch (error) {
          console.warn('Health check failed:', error);
        }
      }

      window.fetchHistory = fetchHistory;
      window.testConnection = testConnection;
      window.saveTestData = saveTestData;

      testBtn.addEventListener('click', testConnection);
      saveBtn.addEventListener('click', saveTestData);
      refreshBtn.addEventListener('click', fetchHistory);

      testConnection().then(() => {
        fetchHistory();
      }).catch(() => {
        fetchHistory(); // 即使測試失敗，也嘗試加載
      });
      checkHealth();
    });
  </script>
</body>
</html>
