<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translation History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">Translation History</h1>
    <div id="historyList" class="space-y-4">
      <p class="text-red-500">History endpoint is currently disabled. Please check server configuration.</p>
    </div>
  </div>

  <script type="module">
    const COLAB_URL = "https://be3d2f08d2f6.ngrok-free.app"; // 更新為最新的 ngrok URL
    const HISTORY_ENDPOINT = `${COLAB_URL}/history`;

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');

      async function fetchHistory() {
        try {
          console.log(`Fetching from: ${HISTORY_ENDPOINT}`);
          const response = await fetch(HISTORY_ENDPOINT, { method: 'GET' });
          console.log(`Response status: ${response.status}`);
          console.log(`Response headers:`, Object.fromEntries(response.headers));
          const text = await response.text();
          console.log(`Response text:`, text.substring(0, 100) + '...');
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}, message: ${text.substring(0, 100)}...`);
          }
          let history;
          try {
            history = JSON.parse(text);
          } catch (e) {
            throw new Error(`Invalid JSON: ${text.substring(0, 100)}...`);
          }
          historyList.innerHTML = '';
          history.forEach(record => {
            const item = document.createElement('div');
            item.className = 'p-4 border rounded shadow';
            item.innerHTML = `
              <p><strong>User:</strong> ${record.user || 'Unknown'}</p>
              <p><strong>Text:</strong> ${record.text || 'N/A'}</p>
              <p><strong>Gesture:</strong> ${record.gesture || 'N/A'}</p>
              <p><strong>Time:</strong> ${new Date(record.timestamp).toLocaleString()}</p>
            `;
            historyList.appendChild(item);
          });
        } catch (error) {
          console.error('Failed to fetch history:', error);
          historyList.innerHTML = `<p class="text-red-500">Failed to load history. Error: ${error.message}</p>`;
        }
      }

      // 由於 /history 端點已移除，暫時禁用自動刷新
      // fetchHistory(); // 初始加載
      // setInterval(fetchHistory, 30000); // 每 30 秒刷新
    });
  </script>
</body>
</html>
