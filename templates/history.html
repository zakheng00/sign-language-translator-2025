<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translation History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">Translation History</h1>
    <div id="historyList" class="space-y-4"></div>
  </div>

  <script type="module">
    const COLAB_URL = "https://f7e8b5bbe191.ngrok-free.app"; // 替換為你的 ngrok URL
    const HISTORY_ENDPOINT = `${COLAB_URL}/history`;

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');

      async function fetchHistory() {
    const response = await fetch(HISTORY_ENDPOINT, { method: 'GET', mode: 'cors' });
    const history = await response.json();
  }

          if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
          const history = await response.json();
          historyList.innerHTML = ''; // 清空列表

          history.forEach(record => {
            const id = record._id || crypto.randomUUID();  // 使用 MongoDB _id 作為唯一識別碼
            const timestampStr = record.timestamp
              ? new Date(record.timestamp).toLocaleString()
              : 'N/A';

            const item = document.createElement('div');
            item.className = 'p-4 border rounded shadow';
            item.innerHTML = `
              <p><strong>User:</strong> ${record.user || 'Unknown'}</p>
              <p><strong>Text:</strong> ${record.text || 'N/A'}</p>
              <p><strong>Gesture:</strong> ${record.gesture || 'N/A'}</p>
              <p><strong>Error:</strong> ${record.error || 'None'}</p>
              <p><strong>Time:</strong> ${timestampStr}</p>
              ${record.video ? `<video controls><source id="videoSource_${id}" type="video/mp4"></video><br>` : ''}
              ${record.audio ? `<audio controls><source id="audioSource_${id}" type="audio/wav"></audio><br>` : ''}
              <button id="downloadVideoBtn_${id}" class="bg-blue-500 text-white px-2 py-1 rounded ${record.video ? '' : 'hidden'}">Download Video</button>
              <button id="downloadAudioBtn_${id}" class="bg-green-500 text-white px-2 py-1 rounded ${record.audio ? '' : 'hidden'}">Download Audio</button>
            `;
            historyList.appendChild(item);

            // 解碼 video base64 為 blob
            if (record.video) {
              const videoSource = document.getElementById(`videoSource_${id}`);
              const blob = base64ToBlob(record.video, 'video/mp4');
              const url = URL.createObjectURL(blob);
              videoSource.src = url;

              const downloadBtn = document.getElementById(`downloadVideoBtn_${id}`);
              downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = `video_${id}.mp4`;
                a.click();
              };

              // Optional: 在 window unload/reload 時釋放 URL
              window.addEventListener('beforeunload', () => URL.revokeObjectURL(url));
            }

            // 解碼 audio base64 為 blob
            if (record.audio) {
              const audioSource = document.getElementById(`audioSource_${id}`);
              const blob = base64ToBlob(record.audio, 'audio/wav');
              const url = URL.createObjectURL(blob);
              audioSource.src = url;

              const downloadBtn = document.getElementById(`downloadAudioBtn_${id}`);
              downloadBtn.onclick = () => {
                const a = document.createElement('a');
                a.href = url;
                a.download = `audio_${id}.wav`;
                a.click();
              };

              window.addEventListener('beforeunload', () => URL.revokeObjectURL(url));
            }
          });
        } catch (error) {
          console.error('Failed to fetch history:', error);
          historyList.innerHTML = '<p class="text-red-500">Failed to load history. Check console for details.</p>';
        }
      }

      function base64ToBlob(base64, mimeType) {
        const byteCharacters = atob(base64);
        const byteNumbers = new Array(byteCharacters.length);
        for (let i = 0; i < byteCharacters.length; i++) {
          byteNumbers[i] = byteCharacters.charCodeAt(i);
        }
        const byteArray = new Uint8Array(byteNumbers);
        return new Blob([byteArray], { type: mimeType });
      }

      fetchHistory(); // 初始加載
      setInterval(fetchHistory, 30000); // 每 30 秒刷新
    });
  </script>
</body>
</html>
