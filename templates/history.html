<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Translation History</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
  <div class="max-w-2xl mx-auto bg-white p-6 rounded-xl shadow-md">
    <h1 class="text-2xl font-bold mb-4">Translation History</h1>
    <div id="historyList" class="space-y-4"></div>
    <button id="saveBtn" class="mt-4 bg-blue-500 text-white px-4 py-2 rounded">Save Test Data</button>
  </div>

  <script type="module">
    const COLAB_URL = "https://0ae5c8df1dae.ngrok-free.app"; // 更新為 Colab 的 ngrok URL
    const HISTORY_ENDPOINT = `${COLAB_URL}/history`;
    const SAVE_ENDPOINT = `${COLAB_URL}/save_history`;

    document.addEventListener('DOMContentLoaded', () => {
      const historyList = document.getElementById('historyList');
      const saveBtn = document.getElementById('saveBtn');

      async function fetchHistory() {
        try {
          console.log(`Fetching from: ${HISTORY_ENDPOINT}`);
          const response = await fetch(HISTORY_ENDPOINT, { method: 'GET', credentials: 'include' });
          console.log(`Response status: ${response.status}`);
          console.log(`Response headers:`, Object.fromEntries(response.headers));
          const text = await response.text();
          console.log(`Full Response text:`, text);
          if (!response.ok) {
            throw new Error(`HTTP error! status: ${response.status}, message: ${text.substring(0, 100)}...`);
          }
          let history;
          try {
            history = JSON.parse(text);
          } catch (e) {
            throw new Error(`Invalid JSON: ${text.substring(0, 100)}...`);
          }
          historyList.innerHTML = '';
          history.forEach(record => {
            const item = document.createElement('div');
            item.className = 'p-4 border rounded shadow';
            item.innerHTML = `
              <p><strong>User:</strong> ${record.user || 'Unknown'}</p>
              <p><strong>Text:</strong> ${record.text || 'N/A'}</p>
              <p><strong>Gesture:</strong> ${record.gesture || 'N/A'}</p>
              <p><strong>Time:</strong> ${new Date(record.timestamp).toLocaleString()}</p>
            `;
            historyList.appendChild(item);
          });
        } catch (error) {
          console.error('Failed to fetch history:', error);
          historyList.innerHTML = `<p class="text-red-500">Failed to load history. Error: ${error.message}</p>`;
        }
      }

      async function saveHistory() {
        const testData = {
          user: "test_user",
          text: "test text",
          gesture: 1,
          timestamp: new Date().toISOString()
        };
        try {
          console.log(`Saving to: ${SAVE_ENDPOINT}`, testData);
          const response = await fetch(SAVE_ENDPOINT, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(testData),
            credentials: 'include'
          });
          const text = await response.text();
          console.log(`Save response status: ${response.status}`);
          console.log(`Save response text:`, text);
          if (!response.ok) {
            throw new Error(`Save failed: ${text}`);
          }
          fetchHistory(); // 刷新歷史記錄
        } catch (error) {
          console.error('Failed to save history:', error);
        }
      }

      saveBtn.addEventListener('click', saveHistory);
      fetchHistory(); // 初始加載
      setInterval(fetchHistory, 30000); // 每 30 秒刷新
    });
  </script>
</body>
</html>
