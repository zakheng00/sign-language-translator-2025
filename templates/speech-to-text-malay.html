<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pertuturan ke Teks (Melayu) - Penterjemah Bahasa Isyarat</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.2.0/crypto-js.min.js"></script>
</head>
<body class="bg-gradient-to-br from-teal-100 to-blue-200 min-h-screen flex flex-col">
    <header class="bg-gradient-to-r from-teal-500 to-blue-600 text-white py-6 px-4 shadow-lg">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-3xl font-bold">Penterjemah Bahasa Isyarat</h1>
            <nav>
                <a href="/" class="hover:underline mx-4">Laman Utama</a>
                <a href="/history" class="hover:underline mx-4">Sejarah</a>
                <a href="/speech-to-text" class="hover:underline mx-4">Pertuturan ke Teks (Inggeris)</a>
                <a href="/live-translation" class="hover:underline mx-4">Terjemahan Langsung</a>
            </nav>
        </div>
    </header>

    <main class="container mx-auto flex-grow py-8 px-4">
        <section class="bg-white rounded-3xl shadow-xl p-8 max-w-2xl mx-auto">
            <h2 class="text-2xl font-bold text-center mb-6">Pertuturan ke Teks (Melayu)</h2>
            <p class="text-gray-600 text-center mb-6">Rakam atau muat naik audio dalam Bahasa Melayu untuk ditranskrip.</p>

            <div class="flex justify-center mb-6">
                <button id="startRecording" class="bg-teal-500 text-white px-6 py-3 rounded-full hover:bg-teal-600 transition">Mulakan Rakaman</button>
                <button id="stopRecording" class="bg-red-500 text-white px-6 py-3 rounded-full hover:bg-red-600 transition ml-4 hidden">Hentikan Rakaman</button>
                <input type="file" id="audioInput" accept="audio/*" class="hidden">
                <button id="uploadBtn" class="bg-blue-500 text-white px-6 py-3 rounded-full hover:bg-blue-600 transition ml-4">Muat Naik Audio</button>
            </div>

            <div id="result" class="text-center text-lg font-semibold text-gray-800"></div>
        </section>
    </main>

    <footer class="bg-gray-800 text-white py-4">
        <div class="container mx-auto text-center">
            <p>© 2025 Penterjemah Bahasa Isyarat. Hak cipta terpelihara.</p>
        </div>
    </footer>

    <script>
        const TRANSLATIONS = {
            transcribing: { en: "Transcribing...", ms: "Sedang mentranskrip..." },
            noAudio: { en: "No audio recorded or uploaded.", ms: "Tiada audio dirakam atau dimuat naik." },
            noTranscription: { en: "No transcription detected.", ms: "Tiada transkripsi dikesan." },
            result: { en: "Result", ms: "Keputusan" },
            error: { en: "Error", ms: "Ralat" },
            serverError: { en: "Server error, please try again later.", ms: "Ralat pelayan, sila cuba lagi kemudian." },
            timeoutError: { en: "Request timed out, please check server status.", ms: "Permintaan telah tamat masa, sila semak status pelayan." }
        };

        async function fetchColabUrl() {
            try {
                const response = await fetch('/health', {
                    headers: { 'ngrok-skip-browser-warning': 'true' },
                    timeout: 10000 // 10秒超時
                });
                if (response.ok) {
                    const data = await response.json();
                    return data.colab_url || 'https://sign-language-translator-2025.onrender.com';
                }
            } catch (error) {
                console.error('Failed to fetch COLAB_URL:', error);
            }
            return 'https://sign-language-translator-2025.onrender.com';
        }

        (async () => {
            const FLASK_URL = await fetchColabUrl();
            const SPEECH_ENDPOINT = `${FLASK_URL}/speech_to_text_malay`;

            let mediaRecorder;
            let recordedBlobs = [];
            const startRecordingBtn = document.getElementById('startRecording');
            const stopRecordingBtn = document.getElementById('stopRecording');
            const uploadBtn = document.getElementById('uploadBtn');
            const audioInput = document.getElementById('audioInput');
            const resultDiv = document.getElementById('result');

            function updateResult(message, status = 'info') {
                resultDiv.textContent = message;
                resultDiv.className = `text-center text-lg font-semibold ${
                    status === 'success' ? 'text-green-600' :
                    status === 'error' ? 'text-red-600' :
                    status === 'processing' ? 'text-blue-600' : 'text-gray-800'
                }`;
            }

            startRecordingBtn.onclick = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                    recordedBlobs = [];
                    mediaRecorder.ondataavailable = (event) => {
                        if (event.data.size > 0) recordedBlobs.push(event.data);
                    };
                    mediaRecorder.start();
                    startRecordingBtn.classList.add('hidden');
                    stopRecordingBtn.classList.remove('hidden');
                    updateResult(TRANSLATIONS.transcribing[localStorage.getItem('language') || 'ms'], 'processing');
                } catch (error) {
                    console.error('Recording error:', error);
                    updateResult(`${TRANSLATIONS.error[localStorage.getItem('language') || 'ms']}: ${error.message}`, 'error');
                }
            };

            stopRecordingBtn.onclick = () => {
                mediaRecorder.stop();
                mediaRecorder.stream.getTracks().forEach(track => track.stop());
                startRecordingBtn.classList.remove('hidden');
                stopRecordingBtn.classList.add('hidden');
                uploadBtn.click(); // 自動觸發上傳
            };

            audioInput.onchange = () => {
                if (audioInput.files.length) {
                    recordedBlobs = [audioInput.files[0]];
                    uploadBtn.click();
                }
            };

            uploadBtn.onclick = async () => {
                if (recordedBlobs.length) {
                    const blob = new Blob(recordedBlobs, { type: 'audio/webm;codecs=opus' });
                    const formData = new FormData();
                    const audioId = crypto.randomUUID();
                    formData.append('audio', blob, `recording_${audioId}.webm`);
                    updateResult(TRANSLATIONS.transcribing[localStorage.getItem('language') || 'ms'], 'processing');
                    try {
                        const response = await fetch(SPEECH_ENDPOINT, {
                            method: 'POST',
                            body: formData,
                            headers: { 'ngrok-skip-browser-warning': 'true' },
                            timeout: 180000 // 180秒超時
                        });
                        if (!response.ok) {
                            const errorData = await response.json().catch(() => ({}));
                            let errorMessage = errorData.error || `HTTP error! status: ${response.status}`;
                            if (response.status === 504) {
                                errorMessage = TRANSLATIONS.timeoutError[localStorage.getItem('language') || 'ms'];
                            } else if (response.status === 500) {
                                errorMessage = TRANSLATIONS.serverError[localStorage.getItem('language') || 'ms'];
                            }
                            throw new Error(errorMessage);
                        }
                        const resultData = await response.json();
                        const transcription = resultData.translation?.text || TRANSLATIONS.noTranscription[localStorage.getItem('language') || 'ms'];
                        updateResult(`${TRANSLATIONS.result[localStorage.getItem('language') || 'ms']}: ${transcription}`, resultData.translation?.text ? 'success' : 'error');
                    } catch (error) {
                        console.error('Transcription failed:', error);
                        updateResult(`${TRANSLATIONS.error[localStorage.getItem('language') || 'ms']}: ${error.message}`, 'error');
                    }
                    recordedBlobs = [];
                    audioInput.value = '';
                } else {
                    audioInput.click();
                }
            };
        })();
    </script>
</body>
</html>
