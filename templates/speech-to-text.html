<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text - Audio Transcription</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        #result { margin-top: 20px; font-size: 18px; }
    </style>        
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">🎤 Speech to Text Transcription</h1>
        <div class="text-center mb-4">
            <p>Record your audio and get the text transcription.</p>
        </div>
        <audio id="preview" class="w-full rounded mb-4" controls></audio>
        <div class="flex justify-between items-center mb-4">
            <button id="startBtn" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">Start Recording</button>
            <button id="stopBtn" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600" disabled>Stop Recording</button>
            <button id="uploadBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" disabled>Transcribe</button>
        </div>
        <div id="result" class="mt-4 text-center text-lg font-medium">Click "Start Recording" to begin.</div>
    </div>

    <script type="module">
        const COLAB_URL = "https://be3d2f08d2f6.ngrok-free.app"; // Update with latest ngrok URL
        const SPEECH_ENDPOINT = `${COLAB_URL}/speech_to_text`;

        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const preview = document.getElementById('preview');
            const result = document.getElementById('result');
            let stream;
            let mediaRecorder;
            let recordedBlobs = [];
            let socket = io(COLAB_URL, {
                path: '/socket.io',
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 15,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                timeout: 45000,
                cors: {
                    origin: "https://sign-language-translator-2025.onrender.com",
                    methods: ["GET", "POST"]
                }
            });

            async function startMicrophone() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    preview.srcObject = stream;
                    console.log('Microphone access granted');
                } catch (error) {
                    console.error('Microphone access error:', error);
                    result.innerText = "❌ Cannot access microphone!";
                    alert('Please allow microphone access to continue.');
                }
            }

            startBtn.onclick = () => {
                startMicrophone().then(() => {
                    if (stream && !mediaRecorder) {
                        recordedBlobs = [];
                        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                        mediaRecorder.ondataavailable = event => {
                            if (event.data.size > 0) recordedBlobs.push(event.data);
                        };
                        mediaRecorder.onstop = () => {
                            stopBtn.disabled = true;
                            uploadBtn.disabled = false;
                            preview.srcObject = null;
                        };
                        mediaRecorder.start(1000);
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                        result.innerText = "⏺ Recording in progress...";
                    }
                }).catch(err => {
                    result.innerText = `❌ Recording initialization failed: ${err.message}`;
                });
            };

            stopBtn.onclick = () => {
                if (mediaRecorder) {
                    mediaRecorder.stop();
                    if (stream) stream.getTracks().forEach(track => track.stop());
                    startBtn.disabled = false;
                }
            };

            uploadBtn.onclick = async () => {
                if (recordedBlobs.length) {
                    const blob = new Blob(recordedBlobs, { type: 'audio/webm;codecs=opus' });
                    const formData = new FormData();
                    formData.append('audio', blob, 'recording.webm');
                    result.innerText = "⏳ Transcribing...";
                    try {
                        const response = await fetch(SPEECH_ENDPOINT, {
                            method: 'POST',
                            body: formData,
                            mode: 'cors',
                            credentials: 'include'
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const resultData = await response.json();
                        result.innerText = `✅ Result: ${resultData.text || resultData.error || 'Unknown result'}`;
                        socket.emit('translation', {
                            text: resultData.text,
                            user: 'User',
                            error: resultData.error,
                            sid: socket.id
                        });
                    } catch (error) {
                        console.error('Transcription failed:', error);
                        result.innerText = `❌ Transcription failed: ${error.message}`;
                    }
                } else {
                    result.innerText = "❌ Please record audio first!";
                }
            };

            socket.on('connect', () => {
                console.log('Connected to server');
                result.innerText = '✅ Connected to server';
            });

            socket.on('translation', (data) => {
                result.innerText = `✅ ${data.user}: ${data.text || data.error || 'Unknown result'}`;
            });

            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
                result.innerText = `⚠️ Connection failed: ${error.message}. Retrying...`;
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                result.innerText = `⚠️ Disconnected. Attempting to reconnect...`;
            });

            window.addEventListener('beforeunload', () => {
                if (socket) socket.disconnect();
                if (stream) stream.getTracks().forEach(track => track.stop());
            });
        });
    </script>
</body>
</html>
