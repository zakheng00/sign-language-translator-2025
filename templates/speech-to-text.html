<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text - 語音轉文字</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
    <style>
        #result { margin-top: 20px; font-size: 18px; }
    </style>        
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-xl mx-auto bg-white p-6 rounded-xl shadow-md">
        <h1 class="text-2xl font-bold mb-4">语音翻译系统 🎙️ - Speech to Text Mode</h1>
        <div class="text-center mb-4">
            <p>Record audio and translate to text.</p>
        </div>
        <audio id="preview" class="w-full rounded mb-4" controls></audio>
        <div class="flex justify-between items-center mb-4">
            <button id="startBtn" class="bg-purple-500 text-white px-4 py-2 rounded hover:bg-purple-600">開始錄音</button>
            <button id="stopBtn" class="bg-yellow-500 text-white px-4 py-2 rounded hover:bg-yellow-600" disabled>停止錄音</button>
            <button id="uploadBtn" class="bg-blue-500 text-white px-4 py-2 rounded hover:bg-blue-600" disabled>轉換為文字</button>
        </div>
        <div id="result" class="mt-4 text-center text-lg font-medium">請點擊“開始錄音”以開始。</div>
    </div>

    <script type="module">
        const COLAB_URL = "https://2f93811e26a8.ngrok-free.app"; // 更新為最新 ngrok URL
        const SPEECH_ENDPOINT = `${COLAB_URL}/speech_to_text`; // 明確定義 /speech_to_text 端點

        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const preview = document.getElementById('preview');
            const result = document.getElementById('result');
            let stream;
            let mediaRecorder;
            let recordedBlobs = [];
            let socket = io(COLAB_URL, {
  path: '/socket.io',
  transports: ['websocket', 'polling'],
  reconnection: true,
  reconnectionAttempts: 15,
  reconnectionDelay: 1000,
  reconnectionDelayMax: 5000,
  timeout: 45000,
  cors: {
    origin: "https://sign-language-translator-2025.onrender.com",
    methods: ["GET", "POST"]
  }
});

            // 訪問麥克風
            async function startMicrophone() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    preview.srcObject = stream;
                    console.log('Audio started');
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    result.innerText = "❌ 無法訪問麥克風！";
                    alert('請允許麥克風訪問以繼續！');
                }
            }

            // 開始錄音
            startBtn.onclick = () => {
                startMicrophone().then(() => {
                    if (stream && !mediaRecorder) {
                        recordedBlobs = [];
                        mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                        mediaRecorder.ondataavailable = event => {
                            if (event.data.size > 0) recordedBlobs.push(event.data);
                        };
                        mediaRecorder.onstop = () => {
                            stopBtn.disabled = true;
                            uploadBtn.disabled = false;
                            preview.srcObject = null;
                        };
                        mediaRecorder.start(1000);
                        startBtn.disabled = true;
                        stopBtn.disabled = false;
                        result.innerText = "⏺ 錄音中...";
                        console.log('Recording started');
                    }
                }).catch(err => {
                    result.innerText = `❌ 錄制初始化失敗: ${err.message}`;
                });
            };

            // 停止錄音
            stopBtn.onclick = () => {
                if (mediaRecorder) {
                    mediaRecorder.stop();
                    if (stream) stream.getTracks().forEach(track => track.stop());
                    startBtn.disabled = false;
                }
            };

            // 轉換為文字
            uploadBtn.onclick = async () => {
                if (recordedBlobs.length) {
                    const blob = new Blob(recordedBlobs, { type: 'audio/webm;codecs=opus' });
                    const formData = new FormData();
                    formData.append('audio', blob, 'recording.webm');
                    result.innerText = "⏳ 正在轉換語音為文字...";
                    try {
                        const response = await fetch(SPEECH_ENDPOINT, {
                            method: 'POST',
                            body: formData,
                            mode: 'cors',
                            credentials: 'include'
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const resultData = await response.json();
                        result.innerText = `✅ 轉換結果: ${resultData.text || resultData.error || '未知結果'}`;
                        socket.emit('translation', {
                            text: resultData.text,
                            user: 'User',
                            error: resultData.error,
                            sid: socket.id
                        });
                    } catch (error) {
                        console.error('Conversion failed:', error);
                        result.innerText = `❌ 轉換失敗: ${error.message}`;
                    }
                } else {
                    result.innerText = "❌ 請先錄製音頻！";
                }
            };

            // Socket.IO 事件
            socket.on('connect', () => {
                console.log('Connected to server');
                result.innerText = '✅ 已連接到服務器';
            });

            socket.on('translation', (data) => {
                result.innerText = `✅ ${data.user}: ${data.text || data.error || '未知結果'}`;
            });

            socket.on('connect_error', (error) => {
                console.error('Connection error:', error);
                result.innerText = `⚠️ 連接到服務器失敗: ${error.message}. 正在重試...`;
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
                result.innerText = `⚠️ 已斷開連線. 嘗試自動重連...`;
            });

            // 清理資源
            window.addEventListener('beforeunload', () => {
                if (socket) socket.disconnect();
                if (stream) stream.getTracks().forEach(track => track.stop());
            });
        });
    </script>
</body>
</html>
