<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Speech to Text - 語音轉文字</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        /* 樣式保持不變 */
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #result { margin-top: 20px; font-size: 18px; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Speech to Text - 語音轉文字</h1>
    <button id="startBtn">開始錄音</button>
    <button id="stopBtn" disabled>停止錄音</button>
    <button id="uploadBtn" disabled>轉換為文字</button>
    <div id="result">請點擊“開始錄音”以開始。</div>

    <script type="module">
        const COLAB_URL = "https://4fe696e97fec.ngrok-free.app"; // 指向 Colab 的 ngrok URL，請根據最新 URL 更新

        document.addEventListener('DOMContentLoaded', () => {
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const result = document.getElementById('result');
            let stream;
            let mediaRecorder;
            let recordedBlobs = [];

            // 訪問麥克風
            async function startMicrophone() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                } catch (error) {
                    console.error('Error accessing microphone:', error);
                    result.innerText = "❌ 無法訪問麥克風！";
                }
            }

            // 開始錄音
            startBtn.onclick = () => {
                startMicrophone();
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm;codecs=opus' });
                mediaRecorder.ondataavailable = event => recordedBlobs.push(event.data);
                mediaRecorder.onstop = () => {
                    stopBtn.disabled = true;
                    uploadBtn.disabled = false;
                };
                mediaRecorder.start(1000); // 每 1 秒生成一個 blob
                startBtn.disabled = true;
                stopBtn.disabled = false;
                result.innerText = "⏺ 錄音中...";
            };

            // 停止錄音
            stopBtn.onclick = () => {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                startBtn.disabled = false;
            };

            // 轉換為文字
            uploadBtn.onclick = async () => {
                if (recordedBlobs.length) {
                    const blob = new Blob(recordedBlobs, { type: 'audio/webm;codecs=opus' });
                    const formData = new FormData();
                    formData.append('audio', blob, 'recording.webm');
                    result.innerText = "⏳ 正在转换语音为文本...";
                    try {
                        const response = await fetch(`${COLAB_URL}/speech_to_text`, {
                            method: 'POST',
                            body: formData,
                            mode: 'cors'
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const resultData = await response.json();
                        result.innerText = `✅ 轉換結果: ${resultData.text || resultData.error || '未知结果'}`;
                    } catch (error) {
                        console.error('Conversion failed:', error);
                        result.innerText = `❌ 转换失败: ${error.message}`;
                    }
                } else {
                    result.innerText = "❌ 请先录制音频！";
                }
            };

            // Socket.IO 連線（可選，若需要實時通信）
            let socket = io(COLAB_URL, {
                path: '/socket.io',
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 15,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                timeout: 45000
            });

            socket.on('connect', () => {
                console.log('Connected to server');
            });

            socket.on('translation', (data) => {
                result.innerText = `✅ ${data.user}: ${data.text || data.error || '未知结果'}`;
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
            });
        });
    </script>
</body>
</html>
