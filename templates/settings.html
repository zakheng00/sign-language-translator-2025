<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title data-i18n="settings.title">Sign Language Translation System - Settings</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/i18next@23.11.5/dist/umd/i18next.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    .floating-shapes .shape {
      background: linear-gradient(45deg, #4b5bd7, #a16fe2);
      opacity: 0.3;
      border-radius: 50%;
      animation: float 15s infinite;
    }
    .glass-card {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
    }
    .gradient-text {
      background: linear-gradient(90deg, #4b5bd7, #a16fe2);
      -webkit-background-clip: text;
      color: transparent;
    }
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transform: translateY(0);
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    .btn:active {
      transform: translateY(0);
    }
    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
    }
    .btn-primary {
      background: linear-gradient(90deg, #4b5bd7, #a16fe2);
      color: white;
    }
    .btn-danger {
      background: linear-gradient(90deg, #ef4444, #dc2626);
      color: white;
    }
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    .btn:hover:before {
      left: 100%;
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-20px); }
    }
    .slide-in {
      animation: slideIn 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    .status-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 24px;
    }
    .status-success {
      color: #059669;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    .status-error {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
  </style>
</head>
<body class="relative bg-gray-900 text-white">
  <div class="floating-shapes">
    <div class="shape w-20 h-20 absolute top-10 left-10"></div>
    <div class="shape w-32 h-32 absolute bottom-10 right-10"></div>
    <div class="shape w-16 h-16 absolute top-20 right-20"></div>
  </div>
  
  <div class="relative z-10 max-w-4xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2" data-i18n="settings.title">
          System Settings
        </h1>
        <p class="text-gray-300 text-lg" data-i18n="settings.description">
          Customize your experience with language, feedback, and history management
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-4" data-i18n="settings.language.title">Language Settings</h2>
      <div id="statusBar" class="status-bar text-sm mb-4">
        <div class="flex items-center">
          <span data-i18n="settings.language.current">Current language:</span> <span id="currentLanguage">English</span>
        </div>
      </div>
      <div class="flex flex-wrap gap-4">
        <button id="langEnBtn" class="btn btn-primary" data-i18n="settings.language.english">English</button>
        <button id="langMsBtn" class="btn btn-primary" data-i18n="settings.language.malay">Malay (Bahasa Melayu)</button>
      </div>
    </div>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-4" data-i18n="settings.feedback.title">Feedback</h2>
      <div class="space-y-4">
        <textarea id="feedbackInput" class="w-full p-4 rounded-xl border-2 border-gray-600 focus:border-purple-500 focus:outline-none transition-colors bg-gray-800 text-white" rows="5" data-i18n="[placeholder]settings.feedback.placeholder"></textarea>
        <button id="submitFeedbackBtn" class="btn btn-primary" data-i18n="settings.feedback.submit">Submit Feedback</button>
      </div>
    </div>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-4" data-i18n="settings.history.title">History Management</h2>
      <p class="text-gray-300 mb-4" data-i18n="settings.history.description">Clear all translation history records. This action cannot be undone.</p>
      <button id="clearHistoryBtn" class="btn btn-danger" data-i18n="settings.history.clear">Clear All History</button>
    </div>
  </div>

  <script type="module">
    // Server URL detection
    function detectServerUrl() {
      const currentHost = window.location.hostname;
      const currentProtocol = window.location.protocol;
      return `${currentProtocol}//${currentHost}`;
    }

    const FLASK_URL = detectServerUrl();
    const ENDPOINTS = {
      SETTINGS: `${FLASK_URL}/api/settings`,
      FEEDBACK: `${FLASK_URL}/api/feedback`,
      CLEAR_HISTORY: `${FLASK_URL}/api/clear_history`
    };

    // Initialize i18next
    i18next.init({
      lng: 'en',
      fallbackLng: 'en',
      resources: {
        en: {
          translation: {
            settings: {
              title: 'System Settings',
              description: 'Customize your experience with language, feedback, and history management',
              language: {
                title: 'Language Settings',
                current: 'Current language:',
                english: 'English',
                malay: 'Malay (Bahasa Melayu)'
              },
              feedback: {
                title: 'Feedback',
                placeholder: 'Share your feedback or suggestions...',
                submit: 'Submit Feedback'
              },
              history: {
                title: 'History Management',
                description: 'Clear all translation history records. This action cannot be undone.',
                clear: 'Clear All History'
              }
            }
          }
        },
        ms: {
          translation: {
            settings: {
              title: 'Tetapan Sistem',
              description: 'Sesuaikan pengalaman anda dengan tetapan bahasa, maklum balas, dan pengurusan sejarah',
              language: {
                title: 'Tetapan Bahasa',
                current: 'Bahasa semasa:',
                english: 'Bahasa Inggeris',
                malay: 'Bahasa Melayu'
              },
              feedback: {
                title: 'Maklum Balas',
                placeholder: 'Kongsi maklum balas atau cadangan anda...',
                submit: 'Hantar Maklum Balas'
              },
              history: {
                title: 'Pengurusan Sejarah',
                description: 'Padam semua rekod sejarah terjemahan. Tindakan ini tidak boleh dibatalkan.',
                clear: 'Padam Semua Sejarah'
              }
            }
          }
        }
      }
    }, (err, t) => {
      if (err) {
        console.error('i18next initialization failed:', err);
        return;
      }
      updateContent();
    });

    function updateContent() {
      document.querySelectorAll('[data-i18n]').forEach(element => {
        const key = element.getAttribute('data-i18n');
        if (key.startsWith('[placeholder]')) {
          element.placeholder = i18next.t(key.replace('[placeholder]', ''));
        } else {
          element.textContent = i18next.t(key);
        }
      });
      const currentLang = i18next.language;
      document.getElementById('currentLanguage').textContent = 
        currentLang === 'ms' ? 'Malay (Bahasa Melayu)' : 'English';
    }

    document.addEventListener('DOMContentLoaded', () => {
      const langEnBtn = document.getElementById('langEnBtn');
      const langMsBtn = document.getElementById('langMsBtn');
      const feedbackInput = document.getElementById('feedbackInput');
      const submitFeedbackBtn = document.getElementById('submitFeedbackBtn');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');
      const statusBar = document.getElementById('statusBar');
      const currentLanguage = document.getElementById('currentLanguage');

      function updateStatus(message, type = 'default') {
        const statusIcon = type === 'success' ? '✅' : type === 'error' ? '❌' : 'ℹ️';
        statusBar.innerHTML = `
          <div class="flex items-center">
            <span class="mr-2">${statusIcon}</span>
            <span>${message}</span>
          </div>
        `;
        statusBar.className = `status-bar text-sm ${type === 'success' ? 'status-success' : type === 'error' ? 'status-error' : ''}`;
      }

      async function fetchData(endpoint, options = {}) {
        try {
          const response = await fetch(endpoint, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'ngrok-skip-browser-warning': 'true',
              ...options.headers
            },
            mode: 'cors'
          });
          if (!response.ok) {
            throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          }
          return await response.json();
        } catch (error) {
          console.error(`Fetch failed for ${endpoint}:`, error);
          throw error;
        }
      }

      async function loadCurrentLanguage() {
        try {
          const data = await fetchData(ENDPOINTS.SETTINGS, { method: 'GET' });
          i18next.changeLanguage(data.language, (err) => {
            if (err) {
              console.error('Language change failed:', err);
              updateStatus('Failed to load language settings', 'error');
              return;
            }
            updateContent();
            updateStatus(i18next.t('settings.language.current') + ` ${currentLanguage.textContent}`, 'success');
          });
        } catch (error) {
          updateStatus('Failed to load language settings', 'error');
        }
      }

      async function setLanguage(language) {
        try {
          await fetchData(ENDPOINTS.SETTINGS, {
            method: 'POST',
            body: JSON.stringify({ language })
          });
          i18next.changeLanguage(language, (err) => {
            if (err) {
              console.error('Language change failed:', err);
              updateStatus('Failed to change language', 'error');
              return;
            }
            updateContent();
            updateStatus(`${i18next.t('settings.language.current')} ${currentLanguage.textContent}`, 'success');
          });
        } catch (error) {
          updateStatus(`Failed to change language: ${error.message}`, 'error');
        }
      }

      async function submitFeedback() {
        const feedback = feedbackInput.value.trim();
        if (!feedback) {
          updateStatus(i18next.t('settings.feedback.empty'), 'error');
          return;
        }
        try {
          await fetchData(ENDPOINTS.FEEDBACK, {
            method: 'POST',
            body: JSON.stringify({ feedback })
          });
          updateStatus(i18next.t('settings.feedback.success'), 'success');
          feedbackInput.value = '';
        } catch (error) {
          updateStatus(`${i18next.t('settings.feedback.error')}: ${error.message}`, 'error');
        }
      }

      async function clearHistory() {
        if (!confirm(i18next.t('settings.history.confirm'))) {
          return;
        }
        try {
          await fetchData(ENDPOINTS.CLEAR_HISTORY, { method: 'DELETE' });
          updateStatus(i18next.t('settings.history.success'), 'success');
        } catch (error) {
          updateStatus(`${i18next.t('settings.history.error')}: ${error.message}`, 'error');
        }
      }

      langEnBtn.addEventListener('click', () => setLanguage('en'));
      langMsBtn.addEventListener('click', () => setLanguage('ms'));
      submitFeedbackBtn.addEventListener('click', submitFeedback);
      clearHistoryBtn.addEventListener('click', clearHistory);

      // Initialize
      loadCurrentLanguage();
    });
  </script>
</body>
</html>
