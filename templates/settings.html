  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);

<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-4xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2">
          ⚙️ System Settings
        </h1>
        <p class="text-gray-600 text-lg">
          Customize your experience with language and feedback options
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-6">Language Settings</h2>
      <div class="status-bar mb-6" id="languageStatus">
        <div class="flex items-center">
          <span>Loading language settings...</span>
        </div>
      </div>
      <div class="flex gap-4 justify-center">
        <button id="langEnBtn" class="btn btn-primary">
          <span class="relative z-10">🇬🇧 English</span>
        </button>
        <button id="langMsBtn" class="btn btn-primary">
          <span class="relative z-10">🇲🇾 Bahasa Malaysia</span>
        </button>
      </div>
    </div>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-6">Feedback</h2>
      <div class="status-bar mb-6" id="feedbackStatus">
        <div class="flex items-center">
          <span>Submit your feedback to help us improve</span>
        </div>
      </div>
      <textarea id="feedbackInput" class="w-full h-32 p-4 border-2 border-gray-300 rounded-lg focus:outline-none focus:border-blue-500" placeholder="Type your feedback here..."></textarea>
      <div class="flex justify-center mt-4">
        <button id="submitFeedbackBtn" class="btn btn-primary">
          <span class="relative z-10">📬 Submit Feedback</span>
        </button>
      </div>
    </div>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-6">Clear History</h2>
      <div class="status-bar mb-6" id="historyStatus">
        <div class="flex items-center">
          <span>Clear all translation history</span>
        </div>
      </div>
      <div class="flex justify-center">
        <button id="clearHistoryBtn" class="btn btn-danger">
          <span class="relative z-10">🗑️ Clear All History</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { TRANSLATIONS, applyLanguage } from './static/translations.js';

    document.addEventListener('DOMContentLoaded', () => {
      // 初始化語言
      let currentLang = localStorage.getItem('language') || 'en';
      applyLanguage('settings', currentLang);

      // Server URL detection
      function detectServerUrl() {
        const currentHost = window.location.hostname;
        const currentProtocol = window.location.protocol;
        return `${currentProtocol}//${currentHost}`;
      }

      const FLASK_URL = detectServerUrl();
      const COLAB_URL = "https://7d1d03ca5ce8.ngrok-free.app";
      const ENDPOINTS = {
        SETTINGS: `${FLASK_URL}/api/settings`,
        FEEDBACK: `${FLASK_URL}/api/feedback`,
        CLEAR_HISTORY: `${FLASK_URL}/api/clear_history`
      };

      const languageStatus = document.getElementById('languageStatus');
      const feedbackStatus = document.getElementById('feedbackStatus');
      const historyStatus = document.getElementById('historyStatus');
      const langEnBtn = document.getElementById('langEnBtn');
      const langMsBtn = document.getElementById('langMsBtn');
      const feedbackInput = document.getElementById('feedbackInput');
      const submitFeedbackBtn = document.getElementById('submitFeedbackBtn');
      const clearHistoryBtn = document.getElementById('clearHistoryBtn');

      function updateStatus(element, message, type = 'loading') {
        const statusIcon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⏳';
        element.innerHTML = `
          <div class="flex items-center">
            ${type === 'loading' ? '<div class="loading-spinner"></div>' : `<span class="mr-2">${statusIcon}</span>`}
            <span>${message}</span>
          </div>
        `;
        element.className = `status-bar ${
          type === 'success' ? 'status-success' : 
          type === 'error' ? 'status-error' : 
          'status-loading'
        }`;
      }

      async function fetchData(endpoint, options = {}) {
        try {
          const response = await fetch(endpoint, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'ngrok-skip-browser-warning': 'true',
              ...options.headers
            },
            mode: 'cors'
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          return await response.json();
        } catch (error) {
          console.error(`Fetch failed for ${endpoint}:`, error);
          throw error;
        }
      }

      langEnBtn.addEventListener('click', async () => {
        updateStatus(languageStatus, TRANSLATIONS.settings[currentLang].languageStatusLoading, 'loading');
        try {
          await fetchData(ENDPOINTS.SETTINGS, {
            method: 'POST',
            body: JSON.stringify({ language: 'en' })
          });
          applyLanguage('settings', 'en');
        } catch (error) {
          updateStatus(languageStatus, TRANSLATIONS.settings[currentLang].languageStatusError.replace('{error}', error.message), 'error');
        }
      });

      langMsBtn.addEventListener('click', async () => {
        updateStatus(languageStatus, TRANSLATIONS.settings[currentLang].languageStatusLoading, 'loading');
        try {
          await fetchData(ENDPOINTS.SETTINGS, {
            method: 'POST',
            body: JSON.stringify({ language: 'ms' })
          });
          applyLanguage('settings', 'ms');
        } catch (error) {
          updateStatus(languageStatus, TRANSLATIONS.settings[currentLang].languageStatusError.replace('{error}', error.message), 'error');
        }
      });

      submitFeedbackBtn.addEventListener('click', async () => {
        const feedback = feedbackInput.value.trim();
        if (!feedback) {
          updateStatus(feedbackStatus, TRANSLATIONS.settings[currentLang].feedbackError.replace('{error}', 'Feedback cannot be empty'), 'error');
          return;
        }
        updateStatus(feedbackStatus, 'Submitting feedback...', 'loading');
        try {
          await fetchData(ENDPOINTS.FEEDBACK, {
            method: 'POST',
            body: JSON.stringify({ feedback })
          });
          updateStatus(feedbackStatus, TRANSLATIONS.settings[currentLang].feedbackSuccess, 'success');
          feedbackInput.value = '';
        } catch (error) {
          updateStatus(feedbackStatus, TRANSLATIONS.settings[currentLang].feedbackError.replace('{error}', error.message), 'error');
        }
      });

      clearHistoryBtn.addEventListener('click', async () => {
        if (!confirm(TRANSLATIONS.settings[currentLang].historyTitle + ': Are you sure you want to clear all translation history?')) return;
        updateStatus(historyStatus, 'Clearing history...', 'loading');
        try {
          await fetchData(ENDPOINTS.CLEAR_HISTORY, { method: 'DELETE' });
          updateStatus(historyStatus, TRANSLATIONS.settings[currentLang].historySuccess, 'success');
        } catch (error) {
          updateStatus(historyStatus, TRANSLATIONS.settings[currentLang].historyError.replace('{error}', error.message), 'error');
        }
      });
    });
  </script>
</body>
</html>
