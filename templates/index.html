<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Language Translation System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.5.0/socket.io.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
    
    * {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      overflow-x: hidden;
    }
    
    .glass-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.1);
    }
    
    .btn {
      position: relative;
      overflow: hidden;
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      border: none;
      border-radius: 12px;
      font-weight: 600;
      padding: 12px 24px;
      cursor: pointer;
      transform: translateY(0);
    }
    
    .btn:before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
      transition: left 0.5s ease;
    }
    
    .btn:hover:before {
      left: 100%;
    }
    
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }
    
    .btn:active {
      transform: translateY(0);
    }
    
    .btn-primary {
      background: linear-gradient(135deg, #3b82f6, #2563eb);
      color: white;
    }
    
    .floating-shapes {
      position: fixed;
      width: 100%;
      height: 100%;
      overflow: hidden;
      pointer-events: none;
      z-index: 0;
      top: 0;
      left: 0;
    }
    
    .shape {
      position: absolute;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 50%;
      animation: float 6s ease-in-out infinite;
    }
    
    .shape:nth-child(1) {
      width: 80px;
      height: 80px;
      top: 10%;
      left: 10%;
      animation-delay: 0s;
    }
    
    .shape:nth-child(2) {
      width: 120px;
      height: 120px;
      top: 20%;
      right: 10%;
      animation-delay: 2s;
    }
    
    .shape:nth-child(3) {
      width: 60px;
      height: 60px;
      bottom: 20%;
      left: 20%;
      animation-delay: 4s;
    }
    
    @keyframes float {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-20px) rotate(180deg); }
    }
    
    .gradient-text {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    
    .slide-in {
      animation: slideIn 0.8s ease-out forwards;
      opacity: 0;
      transform: translateY(30px);
    }
    
    @keyframes slideIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    .stagger-1 { animation-delay: 0.1s; }
    .stagger-2 { animation-delay: 0.2s; }
    
    .status-bar {
      background: rgba(255, 255, 255, 0.9);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 12px;
      padding: 16px;
    }
    
    .status-success {
      color: #059669;
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
    }
    
    .status-error {
      color: #dc2626;
      background: rgba(220, 38, 38, 0.1);
      border: 1px solid rgba(220, 38, 38, 0.2);
    }
    
    .status-loading {
      color: #d97706;
      background: rgba(245, 158, 11, 0.1);
      border: 1px solid rgba(245, 158, 11, 0.2);
    }
    
    .loading-spinner {
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-top: 3px solid #667eea;
      border-radius: 50%;
      width: 20px;
      height: 20px;
      animation: spin 1s linear infinite;
      margin-right: 8px;
    }
    
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-4xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <nav class="flex justify-center gap-4 mb-4">
        <a href="/" class="nav-link text-blue-600 hover:underline">Home</a>
        <a href="/live-translation" class="nav-link text-blue-600 hover:underline">Live Translation</a>
        <a href="/room-mode" class="nav-link text-blue-600 hover:underline">Room Mode</a>
        <a href="/speech-to-text" class="nav-link text-blue-600 hover:underline">Speech to Text</a>
        <a href="/history" class="nav-link text-blue-600 hover:underline">History</a>
      </nav>
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2">
          Sign Language Translator
        </h1>
        <p class="text-gray-600 text-lg">
          Real-time translation for sign language and speech
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-6">Welcome</h2>
      <p class="text-gray-600 text-lg">
        Welcome to the Sign Language Translation System
      </p>
    </div>
    
    <div class="glass-card rounded-3xl p-8 slide-in stagger-2">
      <h2 class="text-2xl font-bold gradient-text mb-6">Language Settings</h2>
      <div class="status-bar mb-6" id="languageStatus">
        <div class="flex items-center">
          <span>Loading language settings...</span>
        </div>
      </div>
      <div class="flex gap-4 justify-center">
        <button id="langEnBtn" class="btn btn-primary">
          <span class="relative z-10">🇬🇧 English</span>
        </button>
        <button id="langMsBtn" class="btn btn-primary">
          <span class="relative z-10">🇲🇾 Bahasa Malaysia</span>
        </button>
      </div>
    </div>
  </div>

  <script type="module">
    import { TRANSLATIONS, applyLanguage } from './static/translations.js';

    document.addEventListener('DOMContentLoaded', () => {
      // Initialize language
      let currentLang = localStorage.getItem('language') || 'en';
      applyLanguage('index', currentLang);

      // Server URL detection
      function detectServerUrl() {
        const currentHost = window.location.hostname;
        const currentProtocol = window.location.protocol;
        const port = window.location.port ? `:${window.location.port}` : '';
        return `${currentProtocol}//${currentHost}${port}`;
      }

      const FLASK_URL = detectServerUrl();
      const ENDPOINTS = {
        SETTINGS: `${FLASK_URL}/api/settings`
      };

      // Initialize Socket.IO
      const socket = io(FLASK_URL, {
        path: '/socket.io',
        transports: ['websocket', 'polling']
      });

      const languageStatus = document.getElementById('languageStatus');
      const langEnBtn = document.getElementById('langEnBtn');
      const langMsBtn = document.getElementById('langMsBtn');
      const navLinks = document.querySelectorAll('.nav-link');

      // Update navigation links
      if (navLinks.length >= 5) {
        navLinks[0].textContent = TRANSLATIONS.index[currentLang].indexLink;
        navLinks[1].textContent = TRANSLATIONS.index[currentLang].liveTranslationLink;
        navLinks[2].textContent = TRANSLATIONS.index[currentLang].roomModeLink;
        navLinks[3].textContent = TRANSLATIONS.index[currentLang].speechToTextLink;
        navLinks[4].textContent = TRANSLATIONS.index[currentLang].historyLink;
      }

      // Socket.IO language change listener
      socket.on('language_changed', (data) => {
        applyLanguage('index', data.language);
        navLinks[0].textContent = TRANSLATIONS.index[data.language].indexLink;
        navLinks[1].textContent = TRANSLATIONS.index[data.language].liveTranslationLink;
        navLinks[2].textContent = TRANSLATIONS.index[data.language].roomModeLink;
        navLinks[3].textContent = TRANSLATIONS.index[data.language].speechToTextLink;
        navLinks[4].textContent = TRANSLATIONS.index[data.language].historyLink;
      });

      function updateStatus(element, message, type = 'loading') {
        const statusIcon = type === 'success' ? '✅' : type === 'error' ? '❌' : '⏳';
        element.innerHTML = `
          <div class="flex items-center">
            ${type === 'loading' ? '<div class="loading-spinner"></div>' : `<span class="mr-2">${statusIcon}</span>`}
            <span>${message}</span>
          </div>
        `;
        element.className = `status-bar ${
          type === 'success' ? 'status-success' : 
          type === 'error' ? 'status-error' : 
          'status-loading'
        }`;
      }

      async function fetchData(endpoint, options = {}) {
        try {
          const response = await fetch(endpoint, {
            ...options,
            headers: {
              'Content-Type': 'application/json',
              'Accept': 'application/json',
              'ngrok-skip-browser-warning': 'true',
              ...options.headers
            },
            mode: 'cors'
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}: ${await response.text()}`);
          return await response.json();
        } catch (error) {
          console.error(`Fetch failed for ${endpoint}:`, error);
          throw error;
        }
      }

      langEnBtn.addEventListener('click', async () => {
        updateStatus(languageStatus, TRANSLATIONS.index[currentLang].languageStatusLoading, 'loading');
        try {
          await fetchData(ENDPOINTS.SETTINGS, {
            method: 'POST',
            body: JSON.stringify({ language: 'en' })
          });
          applyLanguage('index', 'en');
          navLinks[0].textContent = TRANSLATIONS.index['en'].indexLink;
          navLinks[1].textContent = TRANSLATIONS.index['en'].liveTranslationLink;
          navLinks[2].textContent = TRANSLATIONS.index['en'].roomModeLink;
          navLinks[3].textContent = TRANSLATIONS.index['en'].speechToTextLink;
          navLinks[4].textContent = TRANSLATIONS.index['en'].historyLink;
        } catch (error) {
          updateStatus(languageStatus, TRANSLATIONS.index[currentLang].languageStatusError.replace('{error}', error.message), 'error');
        }
      });

      langMsBtn.addEventListener('click', async () => {
        updateStatus(languageStatus, TRANSLATIONS.index[currentLang].languageStatusLoading, 'loading');
        try {
          await fetchData(ENDPOINTS.SETTINGS, {
            method: 'POST',
            body: JSON.stringify({ language: 'ms' })
          });
          applyLanguage('index', 'ms');
          navLinks[0].textContent = TRANSLATIONS.index['ms'].indexLink;
          navLinks[1].textContent = TRANSLATIONS.index['ms'].liveTranslationLink;
          navLinks[2].textContent = TRANSLATIONS.index['ms'].roomModeLink;
          navLinks[3].textContent = TRANSLATIONS.index['ms'].speechToTextLink;
          navLinks[4].textContent = TRANSLATIONS.index['ms'].historyLink;
        } catch (error) {
          updateStatus(languageStatus, TRANSLATIONS.index[currentLang].languageStatusError.replace('{error}', error.message), 'error');
        }
      });
    });
  </script>
</body>
</html>
