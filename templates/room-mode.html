<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign Language Chat Room</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.5.0/socket.io.min.js"></script>
  <script type="module">
    // 根據實際 Render URL 更新
    const COLAB_URL = "https://sign-language-translator-2025.onrender.com";

    tailwind.config = {
      theme: {
        extend: {
          colors: { primary: '#3B82F6', secondary: '#60A5FA' }
        }
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      const roomSelect = document.getElementById('roomSelect');
      const joinRoomBtn = document.getElementById('joinRoomBtn');
      const currentRoomDiv = document.getElementById('currentRoom');
      const chatContainer = document.getElementById('chatContainer');
      const chatBox = document.getElementById('chatBox');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const preview = document.getElementById('preview');
      const startBtn = document.getElementById('startBtn');
      const stopBtn = document.getElementById('stopBtn');
      const translateBtn = document.getElementById('translateBtn');
      const userInput = document.getElementById('userInput');
      let mediaRecorder;
      let recordedBlobs = [];
      let currentRoom = "Default Room"; // 假定默認房間，不需真實加入
      let socket = io(COLAB_URL, { path: '/socket.io' });

      // 連線事件
      socket.on('connect', () => {
        console.log('Connected to server');
        currentRoomDiv.innerText = `Current Room: ${currentRoom}`;
        chatBox.innerHTML = `<p>Welcome to ${currentRoom}!</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      socket.on('message', (data) => {
        chatBox.innerHTML += `<p class="text-gray-500">${data.msg}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      socket.on('translation', (data) => {
        chatBox.innerHTML += `<p><strong>${data.user}:</strong> ${data.gesture || data.error}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      });

      // 模擬加入房間（僅 UI 更新）
      joinRoomBtn.onclick = () => {
        currentRoom = roomSelect.value;
        currentRoomDiv.innerText = `Current Room: ${currentRoom}`;
        chatBox.innerHTML = `<p>Welcome to ${currentRoom}!</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
      };

      // 開始錄製
      startBtn.onclick = () => {
        navigator.mediaDevices.getUserMedia({ video: true, audio: true })
          .then(stream => {
            preview.srcObject = stream;
            mediaRecorder = new MediaRecorder(stream);
            mediaRecorder.ondataavailable = event => recordedBlobs.push(event.data);
            mediaRecorder.start();
            console.log('Recording started');
          });
      };

      // 停止錄製
      stopBtn.onclick = () => {
        if (mediaRecorder) {
          mediaRecorder.stop();
          preview.srcObject.getTracks().forEach(track => track.stop());
          console.log('Recording stopped');
        }
      };

      // 發送翻譯
      translateBtn.onclick = () => {
        if (!recordedBlobs.length) {
          alert('Please record a video first!');
          return;
        }
        const blob = new Blob(recordedBlobs, { type: 'video/mp4' });
        const reader = new FileReader();
        reader.onloadend = () => {
          socket.emit('send_video', {
            video: reader.result,
            user: userInput.value || 'Anonymous'
          });
        };
        reader.readAsDataURL(blob);
        recordedBlobs = [];
      };

      // 模擬假聊天
      sendBtn.onclick = () => {
        const msg = chatInput.value;
        if (!msg) {
          alert('Please enter a message!');
          return;
        }
        chatBox.innerHTML += `<p><strong>You:</strong> ${msg}</p>`;
        chatBox.scrollTop = chatBox.scrollHeight;
        chatInput.value = '';
        setTimeout(() => {
          chatBox.innerHTML += `<p><strong>Other:</strong> ${msg} (translated)</p>`;
          chatBox.scrollTop = chatBox.scrollHeight;
        }, 1000);
      };
    });
  </script>
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen">
  <div class="bg-white p-6 rounded-lg shadow-lg w-full max-w-md">
    <h1 class="text-2xl font-bold mb-4 text-center">Sign Language Chat</h1>
    <div class="mb-4">
      <select id="roomSelect" class="border p-2 rounded w-full">
        <option value="Room 1">Room 1</option>
        <option value="Room 2">Room 2</option>
        <option value="Room 3">Room 3</option>
      </select>
      <button id="joinRoomBtn" class="mt-2 bg-primary text-white p-2 rounded w-full">Join Room</button>
    </div>
    <div id="currentRoom" class="mb-4 text-center"></div>
    <div id="chatContainer" class="mb-4 h-40 overflow-y-auto border p-2 bg-gray-50">
      <div id="chatBox"></div>
    </div>
    <input id="userInput" type="text" placeholder="Your name" class="border p-2 rounded w-full mb-2">
    <input id="chatInput" type="text" placeholder="Type a message" class="border p-2 rounded w-full mb-2">
    <button id="sendBtn" class="bg-secondary text-white p-2 rounded w-full mb-2">Send Message</button>
    <video id="preview" width="100%" controls class="mb-2 hidden"></video>
    <button id="startBtn" class="bg-green-500 text-white p-2 rounded w-full mb-2">Start Recording</button>
    <button id="stopBtn" class="bg-red-500 text-white p-2 rounded w-full mb-2">Stop Recording</button>
    <button id="translateBtn" class="bg-primary text-white p-2 rounded w-full">Translate Sign</button>
  </div>
</body>
</html>
