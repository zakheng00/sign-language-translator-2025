<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Mode - 手語與語音翻譯</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <style>
        /* 樣式保持不變 */
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; }
        #video, #canvas { width: 640px; height: 480px; border: 1px solid #ccc; }
        #result { margin-top: 20px; font-size: 18px; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Room Mode - 手語與語音翻譯</h1>
    <video id="video" autoplay playsinline></video>
    <button id="startBtn">開始錄製</button>
    <button id="stopBtn" disabled>停止錄製</button>
    <button id="uploadBtn" disabled>上傳並翻譯</button>
    <button id="switchModeBtn">切換模式 (當前: 手語)</button>
    <div id="result">請點擊“開始錄製”以開始。</div>

    <script type="module">
        const COLAB_URL = "https://4fe696e97fec.ngrok-free.app"; // 指向 Colab 的 ngrok URL，請根據最新 URL 更新

        document.addEventListener('DOMContentLoaded', () => {
            const video = document.getElementById('video');
            const startBtn = document.getElementById('startBtn');
            const stopBtn = document.getElementById('stopBtn');
            const uploadBtn = document.getElementById('uploadBtn');
            const switchModeBtn = document.getElementById('switchModeBtn');
            const result = document.getElementById('result');
            let stream;
            let mediaRecorder;
            let recordedBlobs = [];
            let isSignLanguageMode = true;

            // 訪問攝像頭
            async function startCamera() {
                try {
                    stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: isSignLanguageMode ? false : true });
                    video.srcObject = stream;
                } catch (error) {
                    console.error('Error accessing camera/microphone:', error);
                    result.innerText = "❌ 無法訪問攝像頭或麥克風！";
                }
            }

            // 開始錄製
            startBtn.onclick = () => {
                startCamera();
                mediaRecorder = new MediaRecorder(stream, { mimeType: isSignLanguageMode ? 'video/webm' : 'audio/webm;codecs=opus' });
                mediaRecorder.ondataavailable = event => recordedBlobs.push(event.data);
                mediaRecorder.onstop = () => {
                    stopBtn.disabled = true;
                    uploadBtn.disabled = false;
                };
                mediaRecorder.start(1000); // 每 1 秒生成一個 blob
                startBtn.disabled = true;
                stopBtn.disabled = false;
                result.innerText = "⏺ 錄製中...";
            };

            // 停止錄製
            stopBtn.onclick = () => {
                mediaRecorder.stop();
                stream.getTracks().forEach(track => track.stop());
                startBtn.disabled = false;
            };

            // 上傳並翻譯
            uploadBtn.onclick = async () => {
                if (recordedBlobs.length) {
                    const blob = new Blob(recordedBlobs, { type: isSignLanguageMode ? 'video/webm' : 'audio/webm;codecs=opus' });
                    const formData = new FormData();
                    formData.append(isSignLanguageMode ? 'video' : 'audio', blob, isSignLanguageMode ? 'recording.mp4' : 'recording.webm');
                    result.innerText = `⏳ 正在${isSignLanguageMode ? '上传并翻译手语' : '转换语音为文本'}...`;
                    try {
                        const endpoint = isSignLanguageMode ? '/predict_colab' : '/speech_to_text';
                        const response = await fetch(`${COLAB_URL}${endpoint}`, {
                            method: 'POST',
                            body: formData,
                            mode: 'cors'
                        });
                        if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                        const resultData = await response.json();
                        const translatedMessage = `User: ${resultData.gesture || resultData.text || resultData.error || '未知结果'}`;
                        result.innerText = `✅ ${translatedMessage}`;
                    } catch (error) {
                        console.error(`${isSignLanguageMode ? 'Upload' : 'Conversion'} failed:`, error);
                        result.innerText = `❌ ${isSignLanguageMode ? '上传' : '转换'}失败: ${error.message}`;
                    }
                } else {
                    result.innerText = "❌ 请先录制视频或音频！";
                }
            };

            // 切換模式
            switchModeBtn.onclick = () => {
                isSignLanguageMode = !isSignLanguageMode;
                switchModeBtn.textContent = `切換模式 (當前: ${isSignLanguageMode ? '手語' : '語音'})`;
                if (stream) {
                    stream.getTracks().forEach(track => track.stop());
                    startCamera(); // 重新啟動攝像頭/麥克風
                }
            };

            // Socket.IO 連線（可選，若需要實時通信）
            let socket = io(COLAB_URL, {
                path: '/socket.io',
                transports: ['websocket', 'polling'],
                reconnection: true,
                reconnectionAttempts: 15,
                reconnectionDelay: 1000,
                reconnectionDelayMax: 5000,
                timeout: 45000
            });

            socket.on('connect', () => {
                console.log('Connected to server');
            });

            socket.on('translation', (data) => {
                result.innerText = `✅ ${data.user}: ${data.gesture || data.text || data.error || '未知结果'}`;
            });

            socket.on('disconnect', () => {
                console.log('Disconnected from server');
            });
        });
    </script>
</body>
</html>
