<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Language Translation System - Room Mode</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script> <!-- 更新版本 -->
  <style>
    /* [保持現有 CSS 不變] */
  </style>
</head>
<body class="relative">
  <div class="floating-shapes">
    <div class="shape"></div>
    <div class="shape"></div>
    <div class="shape"></div>
  </div>
  
  <div class="relative z-10 max-w-6xl mx-auto p-8 space-y-8">
    <header class="text-center slide-in stagger-1">
      <div class="glass-card rounded-3xl p-8 mb-8">
        <h1 class="text-4xl font-bold gradient-text mb-2">
          🚪 Collaborative Room Mode
        </h1>
        <p class="text-gray-600 text-lg">
          Real-time translation rooms for seamless communication
        </p>
      </div>
    </header>
    
    <div class="glass-card rounded-3xl p-6 slide-in stagger-2">
      <div class="flex items-center justify-between mb-4">
        <div>
          <h2 class="text-xl font-bold gradient-text">Available Rooms</h2>
          <p class="text-gray-600 text-sm">Max 2 users per room</p>
        </div>
        <div id="currentRoom" class="text-sm font-medium text-gray-700 flex items-center"></div>
      </div>
      
      <div id="roomsList" class="flex gap-3 mb-4"></div>
      <div id="roomError" class="text-center mt-2 p-3 rounded-xl text-sm hidden"></div>
    </div>

    <div id="chatContainer" class="glass-card rounded-3xl p-8 slide-in stagger-3">
      <div class="mb-6">
        <h3 class="text-xl font-bold gradient-text mb-4 flex items-center">
          <span class="status-indicator status-online"></span>
          Live Chat & Translation
        </h3>
        <div id="chatBox" class="chat-container h-64 p-4 mb-4 overflow-y-auto rounded-2xl border-2 border-gray-200"></div>
        <div class="flex gap-3">
          <input id="chatInput" class="flex-1 border-2 border-gray-200 p-3 rounded-xl focus:border-blue-500 focus:outline-none transition-colors" placeholder="Type a message..." />
          <button id="sendBtn" class="btn btn-primary px-6 py-3 rounded-xl">
            <span class="relative z-10">Send</span>
          </button>
        </div>
      </div>
    </div>

    <div class="glass-card rounded-3xl p-8 slide-in stagger-4">
      <div class="text-center mb-6">
        <h3 class="text-xl font-bold gradient-text mb-4">Translation Mode</h3>
        <div class="flex gap-4 justify-center">
          <button id="signLanguageBtn" class="btn btn-primary px-6 py-3 rounded-xl mode-btn">
            <span class="relative z-10">🤟 Sign Language</span>
          </button>
          <button id="speechToTextBtn" class="btn btn-success px-6 py-3 rounded-xl mode-btn">
            <span class="relative z-10">🎤 Speech to Text</span>
          </button>
        </div>
      </div>
    </div>

    <div class="glass-card rounded-3xl p-8 slide-in stagger-5">
      <div class="video-container mb-6">
        <div class="video-inner">
          <video id="preview" class="w-full aspect-video object-cover" autoplay muted></video>
          <audio id="audioPreview" class="w-full rounded-2xl hidden" controls></audio>
        </div>
      </div>
      
      <div class="flex flex-wrap gap-4 justify-center mb-6">
        <button id="startRecordBtn" class="btn btn-purple px-6 py-3 rounded-xl">
          <span class="relative z-10">🎬 Start Recording</span>
        </button>
        <button id="stopRecordBtn" class="btn btn-warning px-6 py-3 rounded-xl" disabled>
          <span class="relative z-10">⏹️ Stop Recording</span>
        </button>
        <button id="uploadBtn" class="btn btn-primary px-6 py-3 rounded-xl" disabled>
          <span class="relative z-10">🚀 Upload & Translate</span>
        </button>
      </div>
      
      <div id="result" class="text-center text-lg font-medium p-4 rounded-xl bg-gray-50 border-2 border-gray-200">
        <div class="text-gray-500">
          👋 Ready to translate - Select a mode and start recording
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    const COLAB_URL = "https://<latest-ngrok-url>"; // 更新為最新 ngrok URL
    const PREDICT_ENDPOINT = `${COLAB_URL}/predict_colab`;
    const SPEECH_ENDPOINT = `${COLAB_URL}/speech_to_text`;

    document.addEventListener('DOMContentLoaded', () => {
      const roomsList = document.getElementById('roomsList');
      const currentRoomDiv = document.getElementById('currentRoom');
      const roomError = document.getElementById('roomError');
      const chatContainer = document.getElementById('chatContainer');
      const chatBox = document.getElementById('chatBox');
      const chatInput = document.getElementById('chatInput');
      const sendBtn = document.getElementById('sendBtn');
      const preview = document.getElementById('preview');
      const audioPreview = document.getElementById('audioPreview');
      const startRecordBtn = document.getElementById('startRecordBtn');
      const stopRecordBtn = document.getElementById('stopRecordBtn');
      const uploadBtn = document.getElementById('uploadBtn');
      const result = document.getElementById('result');
      const signLanguageBtn = document.getElementById('signLanguageBtn');
      const speechToTextBtn = document.getElementById('speechToTextBtn');
      let stream;
      let mediaRecorder;
      let recordedBlobs = [];
      let socket = io(COLAB_URL, {
        path: '/socket.io',
        transports: ['websocket', 'polling'],
        forceNew: true,
        reconnection: true,
        reconnectionAttempts: 15,
        reconnectionDelay: 1000,
        reconnectionDelayMax: 5000,
        timeout: 45000,
        cors: { origin: "*", methods: ["GET", "POST"] } // 開發時使用 *
      });
      let processedTranslations = new Set();
      let isSignLanguageMode = true;

      chatContainer.style.display = 'block';
      chatInput.disabled = false;

      function showError(message) {
        roomError.textContent = message;
        roomError.className = 'text-center mt-2 p-3 rounded-xl text-sm error-message';
        roomError.classList.remove('hidden');
        setTimeout(() => roomError.classList.add('hidden'), 5000);
      }

      function addChatMessage(message, isSelf = false, isTranslated = false) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `mb-3 chat-message ${isSelf ? 'text-right' : 'text-left'}`;
        const spanClass = isSelf ? 'bg-blue-500 text-white' : isTranslated ? 'bg-green-100 text-green-800 border border-green-200' : 'bg-gray-100 text-gray-800';
        messageDiv.innerHTML = `<span class="inline-block p-3 rounded-xl ${spanClass} max-w-xs break-words">${message}</span>`;
        chatBox.appendChild(messageDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
      }

      function createRoomCard(roomId, userCount = 0) {
        const full = userCount >= 2;
        const btnText = full ? 'Full' : 'Join';
        const btnClass = full ? 'btn-gray cursor-not-allowed' : 'btn-primary';
        const card = document.createElement('div');
        card.className = 'room-card p-4 rounded-xl shadow-md flex-1 min-w-0';
        card.innerHTML = `
          <div class="text-center">
            <h3 class="text-lg font-bold gradient-text mb-2">${roomId}</h3>
            <p class="text-gray-600 text-sm mb-3 flex items-center justify-center">
              <span class="status-indicator ${full ? 'status-offline' : 'status-online'}"></span>
              ${userCount}/2
            </p>
            <button ${full ? 'disabled' : ''} class="btn ${btnClass} btn-compact rounded-lg join-btn" data-room-id="${roomId}">
              <span class="relative z-10">${btnText}</span>
            </button>
          </div>
        `;
        roomsList.appendChild(card);
      }

      ['Room 1', 'Room 2', 'Room 3'].forEach(roomId => createRoomCard(roomId));

      roomsList.addEventListener('click', (event) => {
        const button = event.target.closest('.join-btn');
        if (button && !button.disabled) {
          const roomId = button.getAttribute('data-room-id');
          currentRoomDiv.innerHTML = `<span class="status-indicator status-online"></span>Connected: ${roomId}`;
          chatContainer.classList.remove('hidden');
          showError('✅ Successfully joined room!');
          roomError.className = 'text-center mt-2 p-3 rounded-xl text-sm bg-green-100 border border-green-200 text-green-800';
          socket.emit('join_room', { room: roomId }); // 發送加入房間請求
        }
      });

      socket.on('connect', () => {
        console.log('Connected to server, socket.connected:', socket.connected);
        addChatMessage('🟢 Connected to chat room', true);
      });

      socket.on('message', (data) => {
        addChatMessage(data.msg, data.sid === socket.id);
      });

      socket.on('translation', (data) => {
        const key = `${data.user}-${data.gesture || data.text || data.error}`;
        if (!processedTranslations.has(key)) {
          processedTranslations.add(key);
          const message = `${data.user}: ${data.gesture || data.text || data.error || 'Unknown result'}`;
          addChatMessage(message, data.sid === socket.id, true);
          updateResult(`✅ Translation Result: ${data.gesture || data.text || data.error || 'Unknown result'}`, 'success');
        }
      });

      socket.on('connect_error', (error) => {
        console.error('Connection error:', error);
        showError(`⚠️ Failed to connect to server: ${error.message}. Retrying...`);
      });

      socket.on('disconnect', (reason) => {
        console.log('Disconnected:', reason);
        showError(`⚠️ Disconnected: ${reason}. Attempting to reconnect...`);
      });

      sendBtn.addEventListener('click', () => {
        const msg = chatInput.value.trim();
        if (msg && socket.connected) {
          socket.emit('message', { msg, sid: socket.id, room: currentRoomDiv.textContent.split(':')[1].trim() }); // 發送到當前房間
          addChatMessage(msg, true);
          chatInput.value = '';
        }
      });

      chatInput.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          sendBtn.click();
        }
      });

      function updateResult(message, type = 'default') {
        const resultEl = document.getElementById('result');
        const colorClass = type === 'success' ? 'bg-green-50 border-green-200 text-green-800' : 
                          type === 'error' ? 'bg-red-50 border-red-200 text-red-800' : 
                          type === 'processing' ? 'bg-yellow-50 border-yellow-200 text-yellow-800' : 
                          'bg-gray-50 border-gray-200 text-gray-600';
        resultEl.className = `text-center text-lg font-medium p-4 rounded-xl border-2 ${colorClass}`;
        resultEl.innerHTML = `<div>${message}</div>`;
      }

      async function initCamera() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ video: true, audio: true });
          preview.srcObject = stream;
          console.log('Camera started');
          updateResult('📹 Camera initialized successfully - Ready to record!', 'success');
        } catch (err) {
          console.error('Failed to start webcam:', err);
          updateResult(`❌ Cannot access camera: ${err.message}`, 'error');
          alert('Please allow camera access to continue!');
        }
      }

      async function initMicrophone() {
        try {
          stream = await navigator.mediaDevices.getUserMedia({ audio: true });
          audioPreview.srcObject = stream;
          audioPreview.classList.remove('hidden');
          preview.classList.add('hidden');
          console.log('Microphone started');
          updateResult('🎤 Microphone initialized successfully - Ready to record!', 'success');
        } catch (err) {
          console.error('Error accessing microphone:', err);
          updateResult(`❌ Cannot access microphone: ${err.message}`, 'error');
          alert('Please allow microphone access to continue!');
        }
      }

      startRecordBtn.onclick = () => {
        if (isSignLanguageMode) {
          if (!stream) {
            initCamera().then(() => {
              if (stream && !mediaRecorder) {
                recordedBlobs = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
                mediaRecorder.ondataavailable = (event) => {
                  if (event.data.size > 0) recordedBlobs.push(event.data);
                  console.log('Video blob recorded:', event.data);
                };
                mediaRecorder.start(200); // 調整為 200ms
                startRecordBtn.disabled = true;
                stopRecordBtn.disabled = false;
                uploadBtn.disabled = true;
                updateResult('🔴 Recording video...', 'processing');
              }
            }).catch(err => {
              showError(`❌ Recording initialization failed: ${err.message}`);
            });
          } else if (!mediaRecorder) {
            recordedBlobs = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'video/webm' });
            mediaRecorder.ondataavailable = (event) => {
              if (event.data.size > 0) recordedBlobs.push(event.data);
              console.log('Video blob recorded:', event.data);
            };
            mediaRecorder.start(200);
            startRecordBtn.disabled = true;
            stopRecordBtn.disabled = false;
            uploadBtn.disabled = true;
            updateResult('🔴 Recording video...', 'processing');
          }
        } else {
          if (!stream) {
            initMicrophone().then(() => {
              if (stream && !mediaRecorder) {
                recordedBlobs = [];
                mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                mediaRecorder.ondataavailable = (event) => {
                  if (event.data.size > 0) recordedBlobs.push(event.data);
                  console.log('Audio blob recorded:', event.data);
                };
                mediaRecorder.start(200);
                startRecordBtn.disabled = true;
                stopRecordBtn.disabled = false;
                uploadBtn.disabled = true;
                updateResult('🔴 Recording audio...', 'processing');
              }
            }).catch(err => {
              showError(`❌ Audio recording initialization failed: ${err.message}`);
            });
          } else if (!mediaRecorder) {
            recordedBlobs = [];
            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
            mediaRecorder.ondataavailable = (event) => {
              if (event.data.size > 0) recordedBlobs.push(event.data);
              console.log('Audio blob recorded:', event.data);
            };
            mediaRecorder.start(200);
            startRecordBtn.disabled = true;
            stopRecordBtn.disabled = false;
            uploadBtn.disabled = true;
            updateResult('🔴 Recording audio...', 'processing');
          }
        }
      };

      stopRecordBtn.onclick = () => {
        if (mediaRecorder) {
          mediaRecorder.stop();
          startRecordBtn.disabled = false;
          stopRecordBtn.disabled = true;
          uploadBtn.disabled = false;
          updateResult(isSignLanguageMode ? '✅ Video recording completed - Ready to upload!' : '✅ Audio recording completed - Ready to upload!', 'success');
          console.log('Recording stopped, blobs length:', recordedBlobs.length);
        }
      };

      signLanguageBtn.onclick = () => {
        isSignLanguageMode = true;
        signLanguageBtn.classList.remove('btn-primary');
        signLanguageBtn.classList.add('btn-purple');
        speechToTextBtn.classList.remove('btn-success');
        speechToTextBtn.classList.add('btn-success');
        preview.classList.remove('hidden');
        audioPreview.classList.add('hidden');
        updateResult('Current Mode: Sign Language Translation', 'success');
      };

      speechToTextBtn.onclick = () => {
        isSignLanguageMode = false;
        speechToTextBtn.classList.remove('btn-success');
        speechToTextBtn.classList.add('btn-purple');
        signLanguageBtn.classList.remove('btn-purple');
        signLanguageBtn.classList.add('btn-primary');
        preview.classList.add('hidden');
        audioPreview.classList.remove('hidden');
        updateResult('Current Mode: Speech to Text Translation', 'success');
      };

      uploadBtn.onclick = async () => {
        if (recordedBlobs.length) {
          const blob = new Blob(recordedBlobs, { type: isSignLanguageMode ? 'video/webm' : 'audio/webm' });
          const formData = new FormData();
          formData.append(isSignLanguageMode ? 'video' : 'audio', blob, isSignLanguageMode ? 'recording.mp4' : 'recording.webm');
          updateResult(`⏳ ${isSignLanguageMode ? 'Uploading and translating sign language' : 'Converting speech to text'}...`, 'processing');
          try {
            const response = await fetch(isSignLanguageMode ? PREDICT_ENDPOINT : SPEECH_ENDPOINT, {
              method: 'POST',
              body: formData,
              mode: 'cors',
              credentials: 'include'
            });
            if (!response.ok) {
              const errorText = await response.text();
              console.error('Server error response:', errorText);
              throw new Error(`HTTP error! status: ${response.status}, message: ${errorText || 'No details'}`);
            }
            const resultData = await response.json();
            console.log('Server response at upload:', resultData);
            if (!resultData.text && !resultData.gesture && !resultData.error && !isSignLanguageMode) {
              console.warn('No valid speech data, keeping previous result');
              return;
            }
            const translatedMessage = `User: ${resultData.gesture || resultData.text || resultData.error || 'Unknown result'}`;
            updateResult(`✅ ${translatedMessage}`, 'success');
            socket.emit('translation', {
              gesture: resultData.gesture,
              text: resultData.text,
              user: 'User',
              error: resultData.error,
              sid: socket.id,
              room: currentRoomDiv.textContent.split(':')[1].trim() // 發送到當前房間
            });
          } catch (error) {
            console.error(`${isSignLanguageMode ? 'Upload' : 'Conversion'} failed:`, error);
            updateResult(`❌ ${isSignLanguageMode ? 'Upload' : 'Conversion'} failed: ${error.message}`, 'error');
            showError(`❌ ${isSignLanguageMode ? 'Upload' : 'Conversion'} failed: ${error.message}`);
          } finally {
            recordedBlobs = [];
          }
        } else {
          updateResult('❌ Please record video or audio first!', 'error');
        }
      };
    });
  </script>
</body>
</html>
